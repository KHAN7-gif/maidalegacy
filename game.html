<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>List Game — MAIDA Esports Studio</title>
<meta name="description" content="Senarai game di studio konsol MAIDA Esports — PS5, PS4 & eRacing." />
<meta name="theme-color" content="#ffffff" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#ffffff;--bg-2:#f5f5f7;--ink:#1d1d1f;--soft:#6e6e73;--mut:#86868b;
    --line:rgba(0,0,0,.08);--line-2:rgba(0,0,0,.06);--blue:#0071e3;--red:#ff3b30;
    --glass:rgba(255,255,255,.6);--glass-bd:rgba(255,255,255,.7);
    --shadow:0 10px 40px rgba(0,0,0,.06);--shadow-lg:0 24px 70px rgba(0,0,0,.10);
    --r:18px;--maxw:1180px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;pointer-events:none}
  .b-blue{background:radial-gradient(circle,#7db1ff,transparent 70%)}
  .b-violet{background:radial-gradient(circle,#c4a7ff,transparent 70%)}

  header.nav{position:sticky;top:0;z-index:80;background:rgba(255,255,255,.72);
    -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--line-2)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:-.02em}
  .mark{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:800;font-size:13px}
  .brand small{display:block;font-size:9px;font-weight:600;letter-spacing:.16em;color:var(--mut);margin-top:1px}
  .back{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--soft);padding:9px 16px;border-radius:980px;border:1px solid var(--line);background:#fff;transition:.2s}
  .back:hover{color:var(--ink);box-shadow:var(--shadow)}

  .head{position:relative;overflow:hidden;padding:clamp(40px,6vw,72px) 0 clamp(20px,3vw,30px);background:var(--bg-2);border-bottom:1px solid var(--line-2)}
  .head .b1{width:460px;height:460px;top:-220px;left:-100px}
  .head .b2{width:420px;height:420px;top:-200px;right:-80px}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--blue);position:relative;z-index:2}
  .head h1{font-size:clamp(32px,6vw,58px);font-weight:700;letter-spacing:-.03em;line-height:1.02;margin-top:12px;position:relative;z-index:2}
  .head p{color:var(--soft);font-size:clamp(15px,1.7vw,18px);margin-top:12px;max-width:56ch;position:relative;z-index:2}

  /* filter tabs */
  .filters{position:sticky;top:60px;z-index:60;background:rgba(245,245,247,.82);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border-bottom:1px solid var(--line-2)}
  .filters-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 0}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:980px;padding:5px}
  .tab{border:0;background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--soft);padding:9px 18px;border-radius:980px;cursor:pointer;transition:.18s}
  .tab.active{background:var(--ink);color:#fff}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:inherit;font-size:14px;outline:none;transition:.2s}
  .search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
  .search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:14px}
  .count{color:var(--mut);font-size:13px;font-weight:500;padding:6px 0}

  main{padding:clamp(24px,4vw,40px) 0 80px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
  .gcard{cursor:default}
  .gcover{aspect-ratio:1/1;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(135deg,#e9ecf3,#f7f8fb);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .22s,box-shadow .22s}
  .gcard:hover .gcover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
  .gcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .gcover .ph{position:absolute;inset:0;z-index:1;display:grid;place-items:center;text-align:center;padding:14px;font-weight:800;font-size:clamp(14px,1.4vw,18px);letter-spacing:-.02em;color:#5a5a62}
  .plat{position:absolute;bottom:10px;left:10px;z-index:3;font-size:10px;font-weight:700;letter-spacing:.06em;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--ink);padding:4px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.7)}
  .newb{position:absolute;top:10px;right:10px;z-index:3;font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--red);color:#fff;padding:4px 9px;border-radius:980px;box-shadow:0 4px 12px rgba(255,59,48,.35)}
  .gname{font-size:14px;font-weight:600;letter-spacing:-.01em;margin-top:11px;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gcat{font-size:12px;color:var(--mut);font-weight:500;margin-top:2px}
  .empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:70px 20px;border:1.5px dashed var(--line);border-radius:var(--r)}

  @media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:760px){.grid{grid-template-columns:repeat(3,1fr)}.filters{top:56px}.nav-in{height:56px}}
  @media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="index.html"><span class="mark">MDE</span><span>MAIDA<small>ESPORTS · LABUAN</small></span></a>
    <a class="back" href="index.html">← Kembali ke Laman</a>
  </div>
</header>

<section class="head">
  <span class="blob b-blue b1"></span>
  <span class="blob b-violet b2"></span>
  <div class="wrap">
    <span class="eyebrow">Console Studio</span>
    <h1>List Game.</h1>
    <p>Senarai game tersedia di studio konsol MAIDA Esports — PlayStation 5, PlayStation 4 &amp; eRacing.</p>
  </div>
</section>

<div class="filters">
  <div class="wrap filters-in">
    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="">Semua</button>
      <button class="tab" data-cat="__new">Baru</button>
      <button class="tab" data-cat="PS5">PS5</button>
      <button class="tab" data-cat="PS4">PS4</button>
      <button class="tab" data-cat="eRacing">eRacing</button>
    </div>
    <div class="search"><span class="ic">🔍</span><input id="q" type="search" placeholder="Cari game…" /></div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<script>
  const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const FALLBACK_GAMES=[
    {name:"eFootball 2026",category:"PS5",isNew:"Ya",image:""},
    {name:"EA SPORTS FC 26",category:"PS5",isNew:"Ya",image:""},
    {name:"Tekken 8",category:"PS5",isNew:"Tidak",image:""},
    {name:"Street Fighter 6",category:"PS5",isNew:"Tidak",image:""},
    {name:"Mortal Kombat 1",category:"PS4",isNew:"Tidak",image:""},
    {name:"Gran Turismo 7",category:"eRacing",isNew:"Ya",image:""},
    {name:"F1 24",category:"eRacing",isNew:"Tidak",image:""},
    {name:"Call of Duty",category:"PS5",isNew:"Tidak",image:""},
    {name:"FIFA 23",category:"PS4",isNew:"Tidak",image:""},
    {name:"Assetto Corsa",category:"eRacing",isNew:"Tidak",image:""}
  ];
  let GAMES=[]; let curCat=""; 

  function isNew(g){ return String(g.isNew).toLowerCase()==='ya' || g.isNew===true; }
  function card(g){
    const cover = g.image ? `<img src="${esc(g.image)}" alt="${esc(g.name||'')}" loading="lazy">`
      : `<div class="ph">${esc(g.name||'')}</div>`;
    return `<div class="gcard">
      <div class="gcover">${cover}
        ${g.category?`<span class="plat">${esc(g.category)}</span>`:''}
        ${isNew(g)?`<span class="newb">NEW</span>`:''}
      </div>
      <div class="gname">${esc(g.name||'')}</div>
      ${g.category?`<div class="gcat">${esc(g.category)}</div>`:''}
    </div>`;
  }
  function render(){
    const q=document.getElementById('q').value.trim().toLowerCase();
    let list=GAMES.filter(g=>{
      if(q && !String(g.name||'').toLowerCase().includes(q)) return false;
      if(curCat==='__new') return isNew(g);
      if(curCat && g.category!==curCat) return false;
      return true;
    });
    const grid=document.getElementById('grid');
    grid.innerHTML=list.length?list.map(card).join(''):`<div class="empty">Tiada game ditemui.</div>`;
    document.getElementById('count').textContent=`Menunjukkan ${list.length} daripada ${GAMES.length} game`;
  }
  document.getElementById('tabs').addEventListener('click',e=>{
    const b=e.target.closest('.tab'); if(!b) return;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    b.classList.add('active'); curCat=b.dataset.cat; render();
  });
  document.getElementById('q').addEventListener('input',render);

  function setGames(g){ if(Array.isArray(g)&&g.length){ GAMES=g; render(); } }
  window.MAIDA_GAMES=setGames;

  (async function boot(){
    let data=null;
    try{ const ls=localStorage.getItem('maida_content'); if(ls) data=JSON.parse(ls); }catch(e){}
    if(!data){ try{ const r=await fetch('maida-content.json',{cache:'no-store'}); if(r.ok) data=await r.json(); }catch(e){} }
    GAMES=(data&&Array.isArray(data.games)&&data.games.length)?data.games:FALLBACK_GAMES;
    render();
  })();
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCcTJO9K0gXRaCbzdxqxY7hKr0x1PhNHEQ",
    authDomain: "maidaesportsmy.firebaseapp.com",
    databaseURL: "https://maidaesportsmy-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "maidaesportsmy",
    storageBucket: "maidaesportsmy.firebasestorage.app",
    messagingSenderId: "870248060201",
    appId: "1:870248060201:web:2954d8fed62c18d47dd338"
  };
  try{
    const db=getDatabase(initializeApp(firebaseConfig));
    onValue(ref(db,"site/content"),(snap)=>{
      const d=snap.val();
      if(d){ try{ localStorage.setItem("maida_content",JSON.stringify(d)); }catch(e){}
        if(window.MAIDA_GAMES) window.MAIDA_GAMES(d.games); }
    },(err)=>console.warn("RTDB:",err));
  }catch(e){ console.warn("Firebase init:",e); }
</script>
</body>
</html>
