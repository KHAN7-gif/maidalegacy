<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PS Dashboard — MAIDA LEGACY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',Arial,sans-serif;
  background:#0d0d14;color:#fff;
  min-height:100vh;display:flex;flex-direction:column;
}

/* ── HEADER ──────────────────────────────────────────────────── */
.header{
  background:linear-gradient(135deg,#1a0a2e,#0d0d14);
  border-bottom:1px solid rgba(212,0,107,.3);
  padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{
  font-family:'Georgia',serif;font-size:20px;font-weight:900;
  font-style:italic;letter-spacing:2px;color:#fff
}
.brand-logo span{color:#d4006b}
.brand-tag{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.hdr-clock{
  font-family:'Courier New',monospace;font-size:22px;font-weight:700;
  color:#d4006b;letter-spacing:2px;
}
.hdr-date{font-size:11px;color:rgba(255,255,255,.4);text-align:right;margin-top:2px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d4006b;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}

/* ── REVENUE STRIP ───────────────────────────────────────────── */
.rev-strip{
  display:grid;grid-template-columns:repeat(6,1fr);
  background:#111120;border-bottom:1px solid rgba(255,255,255,.07);
  padding:0;
}
@media(max-width:900px){.rev-strip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.rev-strip{grid-template-columns:repeat(2,1fr)}}
.rev-card{
  padding:14px 18px;text-align:center;
  border-right:1px solid rgba(255,255,255,.06)
}
.rev-card:last-child{border-right:none}
.rev-val{font-size:20px;font-weight:900;letter-spacing:-.5px}
.rev-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.35);margin-top:4px}

/* ── STATION GRID ────────────────────────────────────────────── */
.stations-section{padding:16px 16px 8px}
.stations-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.4);margin-bottom:12px}
.s-grid{
  display:grid;grid-template-columns:repeat(6,1fr);
  gap:8px;
}
@media(max-width:1100px){.s-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){.s-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.s-grid{grid-template-columns:repeat(2,1fr)}}

.s-box{
  border-radius:14px;padding:14px 12px;text-align:center;
  display:flex;flex-direction:column;align-items:center;
  transition:all .3s;position:relative;overflow:hidden;
  min-height:110px;
}
.s-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}

/* Colors */
.s-free{background:linear-gradient(180deg,rgba(30,140,58,.9),rgba(21,128,61,.8));border:1px solid rgba(52,199,89,.3)}
.s-free::before{background:#34c759}
.s-used{background:linear-gradient(180deg,rgba(192,57,43,.9),rgba(169,50,38,.8));border:1px solid rgba(255,69,58,.3)}
.s-used::before{background:#ff453a}
.s-warn{background:linear-gradient(180deg,rgba(230,126,34,.95),rgba(211,84,0,.85));border:1px solid rgba(255,149,0,.4);animation:warnPulse .8s infinite alternate}
.s-warn::before{background:#ff9500}
@keyframes warnPulse{from{filter:brightness(1)}to{filter:brightness(1.15)}}

/* eRacing accent */
.s-er-free{background:linear-gradient(180deg,rgba(26,92,138,.9),rgba(15,74,114,.85));border:1px solid rgba(255,107,53,.4)}
.s-er-free::before{background:#ff6b35}
.s-er-used{background:linear-gradient(180deg,rgba(139,26,107,.9),rgba(107,19,85,.85));border:1px solid rgba(255,107,53,.4)}
.s-er-used::before{background:#ff6b35}

/* Station labels */
.s-num{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.6);margin-bottom:3px}
.s-type{font-size:18px;font-weight:900;letter-spacing:.5px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.s-timer{font-family:'Courier New',monospace;font-size:15px;font-weight:700;color:#fff;margin-top:5px;letter-spacing:1px}
.s-timer.ready{font-size:11px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:5px;letter-spacing:2px}
.s-info{font-size:10px;color:rgba(255,255,255,.65);margin-top:4px;font-weight:600}

/* Joystick badge */
.s-joy{
  font-size:9px;font-weight:800;
  background:rgba(10,132,255,.3);color:#5ac8fa;
  border:1px solid rgba(10,132,255,.4);
  border-radius:4px;padding:2px 6px;margin-top:4px;letter-spacing:.3px
}

/* ── TICKER ──────────────────────────────────────────────────── */
.ticker{
  background:linear-gradient(90deg,#d4006b,#9c004f);
  height:36px;overflow:hidden;display:flex;align-items:center;
  margin-top:auto;flex-shrink:0
}
.ticker-track{display:flex;white-space:nowrap;animation:scroll 30s linear infinite}
.ticker-txt{font-family:'Georgia',serif;font-size:18px;font-weight:700;letter-spacing:2px;color:#fff;padding:0 50px;font-style:italic}
.ticker-sep{color:rgba(255,255,255,.4);padding:0 20px;font-size:14px}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ── STATUS BAR ──────────────────────────────────────────────── */
.status-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 20px;background:rgba(0,0,0,.4);
  border-top:1px solid rgba(255,255,255,.05);flex-wrap:wrap;gap:8px;
}
.status-item{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="brand">
    <div>
      <div class="brand-logo">MAIDA <span>ESPORTS</span></div>
      <div class="brand-tag">PS Dashboard · Admin View</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="live-dot"></div>
    <div>
      <div class="hdr-clock" id="hdrClock">--:--:--</div>
      <div class="hdr-date" id="hdrDate">—</div>
    </div>
  </div>
</div>

<!-- REVENUE STRIP -->
<div class="rev-strip" id="revStrip">
  <div class="rev-card"><div class="rev-val" style="color:#34c759" id="rv-today">RM 0.00</div><div class="rev-lbl">Hasil Hari Ini</div></div>
  <div class="rev-card"><div class="rev-val" style="color:#0a84ff" id="rv-bk">0</div><div class="rev-lbl">Booking Hari Ini</div></div>
  <div class="rev-card"><div class="rev-val" style="color:#5ac8fa" id="rv-ps5">RM 0.00</div><div class="rev-lbl">PS5 Hasil</div></div>
  <div class="rev-card"><div class="rev-val" style="color:#5e5ce6" id="rv-ps4">RM 0.00</div><div class="rev-lbl">PS4 Hasil</div></div>
  <div class="rev-card"><div class="rev-val" style="color:#ff6b35" id="rv-er">RM 0.00</div><div class="rev-lbl">eRacing Hasil</div></div>
  <div class="rev-card"><div class="rev-val" style="color:#ff9500" id="rv-act">0</div><div class="rev-lbl">Aktif Sekarang</div></div>
</div>

<!-- STATIONS -->
<div class="stations-section">
  <div class="stations-title">● PAPARAN STATION LANGSUNG — 12 STATION</div>
  <div class="s-grid" id="stGrid"></div>
</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <div style="display:flex;gap:16px;flex-wrap:wrap">
    <div class="status-item"><div class="status-dot" style="background:#34c759"></div><span id="stFree">0 Bebas</span></div>
    <div class="status-item"><div class="status-dot" style="background:#ff453a"></div><span id="stUsed">0 Digunakan</span></div>
    <div class="status-item"><div class="status-dot" style="background:#ff9500"></div><span id="stWarn">0 Hampir Tamat</span></div>
  </div>
  <div style="font-size:11px;color:rgba(255,255,255,.3)">Auto-refresh setiap 1 saat · Data: psbook_v1</div>
</div>

<!-- TICKER -->
<div class="ticker">
  <div class="ticker-track" id="ticker"></div>
</div>

<script>
// ================================================================
// STATIONS & DATA
// ================================================================
const SK_BK = 'psbook_v1';
const SK_RT = 'psbook_v1_rates';

const STATIONS = Array.from({length:12},(_,i)=>({
  id:i+1,
  name:`Station ${i+1}`,
  type:i<5?'PS5':i<10?'PS4':'eRacing'
}));

const JOY_PRICE = {PS5:8,PS4:5,eRacing:0};

let bks=[];

function rLS(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}

function load(){
  const d=rLS(SK_BK);
  bks=d?.bks||[];
}

function now(){return Date.now();}

function getActive(sid){
  const n=now();
  return bks.filter(b=>b.sid===sid&&b.status==='a'&&new Date(b.st)<=n&&new Date(b.et)>n)
    .sort((a,b)=>new Date(a.et)-new Date(b.et))[0]||null;
}

function getRem(et){return Math.max(0,new Date(et).getTime()-now());}

function fmtCd(ms){
  if(!ms||ms<=0)return'00:00';
  const h=Math.floor(ms/3600000);
  const m=Math.floor((ms%3600000)/60000);
  const s=Math.floor((ms%60000)/1000);
  if(h>0)return `${pad(h)}:${pad(m)}:${pad(s)}`;
  return `${pad(m)}:${pad(s)}`;
}
function pad(n){return String(n).padStart(2,'0');}

// ================================================================
// CLOCK
// ================================================================
function updateClock(){
  const now=new Date();
  const t=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const days=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
  const mons=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
  const d=`${days[now.getDay()]}, ${now.getDate()} ${mons[now.getMonth()]} ${now.getFullYear()}`;
  document.getElementById('hdrClock').textContent=t;
  document.getElementById('hdrDate').textContent=d;
}

// ================================================================
// REVENUE
// ================================================================
function updateRevenue(){
  const today=new Date().toISOString().slice(0,10);
  const todayBks=bks.filter(b=>{try{return new Date(b.st).toISOString().slice(0,10)===today}catch{return false}});
  const todayTotal=todayBks.reduce((s,b)=>s+(b.amt||0),0);
  const ps5Total=todayBks.filter(b=>STATIONS.find(s=>s.id===b.sid)?.type==='PS5').reduce((s,b)=>s+(b.amt||0),0);
  const ps4Total=todayBks.filter(b=>STATIONS.find(s=>s.id===b.sid)?.type==='PS4').reduce((s,b)=>s+(b.amt||0),0);
  const erTotal=todayBks.filter(b=>STATIONS.find(s=>s.id===b.sid)?.type==='eRacing').reduce((s,b)=>s+(b.amt||0),0);
  const activeNow=STATIONS.filter(s=>getActive(s.id)).length;

  document.getElementById('rv-today').textContent=`RM ${todayTotal.toFixed(2)}`;
  document.getElementById('rv-bk').textContent=todayBks.length;
  document.getElementById('rv-ps5').textContent=`RM ${ps5Total.toFixed(2)}`;
  document.getElementById('rv-ps4').textContent=`RM ${ps4Total.toFixed(2)}`;
  document.getElementById('rv-er').textContent=`RM ${erTotal.toFixed(2)}`;
  document.getElementById('rv-act').textContent=activeNow;
}

// ================================================================
// STATION GRID
// ================================================================
function renderGrid(){
  let freeC=0,usedC=0,warnC=0;
  const grid=document.getElementById('stGrid');
  if(!grid)return;

  const html=STATIONS.map(s=>{
    const b=getActive(s.id);
    const rem=b?getRem(b.et):0;
    const isFree=!b||rem<=0;
    const isWarn=b&&rem>0&&rem<300000; // < 5min

    if(isFree)freeC++;
    else{usedC++;if(isWarn)warnC++;}

    const isER=s.type==='eRacing';
    let cls='s-free';
    if(isER){cls=isFree?'s-er-free':'s-er-used';}
    else if(!isFree){cls=isWarn?'s-warn':'s-used';}

    const typeLabel=isER?'🏎 eR':s.type;
    const timerHtml=isFree
      ?`<div class="s-timer ready">READY</div>`
      :`<div class="s-timer">${fmtCd(rem)}</div>`;

    const payIco=b?({'cash':'💵','qr':'📱','fpx':'🏦'}[b.payment||'cash']||''):'';
    const playerInfo=b?`${b.players||1}P ${payIco}`:'';
    const joyBadge=b&&!isER&&(b.xDS5||b.xDS4)?`<div class="s-joy">🕹 ${b.xDS5?'DS5':'DS4'} +RM${JOY_PRICE[s.type]}</div>`:'';

    return`<div class="${cls} s-box" id="sd-${s.id}">
      <div class="s-num">ST ${s.id}</div>
      <div class="s-type">${typeLabel}</div>
      ${timerHtml}
      ${b?`<div class="s-info">${playerInfo}</div>`:''}
      ${joyBadge}
    </div>`;
  }).join('');

  grid.innerHTML=html;

  document.getElementById('stFree').textContent=`${freeC} Bebas`;
  document.getElementById('stUsed').textContent=`${usedC} Digunakan`;
  document.getElementById('stWarn').textContent=`${warnC} Hampir Tamat`;
}

// ================================================================
// TICKER
// ================================================================
function buildTicker(){
  const freeC=STATIONS.filter(s=>!getActive(s.id)).length;
  const items=[
    'MAIDA ESPORTS',
    '🎮 SELAMAT DATANG KE MAIDA ESPORTS',
    `✅ ${freeC} STESEN TERSEDIA`,
    '📍 FINANCIAL PARK LABUAN',
    '🏎 eRacing St 11 & 12',
    '🕹 BOOK SEKARANG DI KAUNTER',
    '🏆 MAIDA LEGACY · LA0083119-X',
  ];
  const html=items.map(t=>`<span class="ticker-txt">${t}</span><span class="ticker-sep">✦</span>`).join('');
  const el=document.getElementById('ticker');
  if(el)el.innerHTML=html+html;
}

// ================================================================
// MAIN LOOP
// ================================================================
let _tickCount=0;
function tick(){
  updateClock();
  _tickCount++;
  if(_tickCount===1||_tickCount%5===0){
    load();
    updateRevenue();
    renderGrid();
  }
  if(_tickCount%20===0) buildTicker();
}

// Cross-tab sync
window.addEventListener('storage',e=>{
  if(e.key===SK_BK){load();updateRevenue();renderGrid();}
});

// Init
load();
buildTicker();
renderGrid();
updateRevenue();
updateClock();
setInterval(tick,1000);
</script>
</body>
</html>
