<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MAIDA Staff">
<title>MAIDA Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#d4006b;--blue:#007aff;--green:#34c759;--red:#ff3b30;--amber:#ff9500;
  --t1:#1c1c1e;--t2:#3c3c43;--t3:#8e8e93;--t4:#c7c7cc;
  --bg:#f2f2f7;--card:#fff;--border:rgba(60,60,67,.15);
  --sh:0 1px 4px rgba(0,0,0,.08);
  --r:12px;--r-lg:16px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Plus Jakarta Sans',-apple-system,sans-serif;color:var(--t1)}

/* ═══ LOGIN ═══ */
#scLogin{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(160deg,#fff0f5 0%,#fce4ec 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;overflow:hidden;
}
#scLogin::before{content:'';position:absolute;top:-20%;right:-15%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(212,0,107,.12),transparent 70%);pointer-events:none}
.lg-logo{text-align:center;margin-bottom:32px;position:relative;z-index:1}
.lg-brand{font-size:36px;font-weight:900;letter-spacing:-1px;color:#1a1a2e}
.lg-brand span{color:var(--pink);font-style:italic}
.lg-sub{font-size:10px;letter-spacing:2px;color:#9ca3af;margin-top:6px;text-transform:uppercase;font-weight:600}
.lg-card{background:#fff;border-radius:22px;padding:28px 22px 24px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.1);position:relative;z-index:1}
.lg-title{font-size:22px;font-weight:700;color:#1a1a2e;text-align:center;margin-bottom:20px}
.lg-field{display:flex;align-items:center;border:1.5px solid #e5e7eb;border-radius:12px;background:#f9fafb;transition:all .2s;overflow:hidden;margin-bottom:12px}
.lg-field:focus-within{border-color:var(--pink);background:#fff;box-shadow:0 0 0 4px rgba(212,0,107,.08)}
.lg-ico{flex-shrink:0;padding:0 12px;color:#9ca3af;display:flex;align-items:center}
.lg-ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lg-field:focus-within .lg-ico{color:var(--pink)}
.lg-input{flex:1;padding:13px 10px 13px 0;border:none;background:transparent;font-size:15px;font-weight:500;color:#1a1a2e;font-family:inherit;outline:none}
.lg-input::placeholder{color:#9ca3af;font-weight:400}
.eye-btn2{padding:0 12px;background:none;border:none;cursor:pointer;color:#9ca3af;display:flex;align-items:center}
.eye-btn2 svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lg-btn{width:100%;padding:15px;background:var(--pink);color:#fff;border:none;border-radius:30px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(212,0,107,.3);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.lg-btn:active{transform:scale(.97)}
.lg-btn svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lg-err{color:#dc2626;font-size:12px;font-weight:700;text-align:center;padding:9px;background:#fee2e2;border-radius:10px;border:1px solid #fca5a5;margin-top:10px;display:none;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lg-ver{font-size:11px;color:#9ca3af;text-align:center;margin-top:20px;font-weight:500}

/* ═══ APP ═══ */
#scApp{display:none;flex-direction:column;height:100%;overflow:hidden}
#scApp.on{display:flex}

/* ═══ TOP BAR ═══ */
.topbar{
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:.5px solid var(--border);
  padding:12px 16px;
  padding-top:max(env(safe-area-inset-top,12px),12px);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;z-index:100;
}
.tb-left .brand{font-size:16px;font-weight:800;letter-spacing:-.3px}
.tb-left .brand span{color:var(--pink)}
.tb-left .user-pill{font-size:11px;font-weight:600;color:var(--t3);margin-top:2px}
.tb-right{display:flex;align-items:center;gap:8px}
.sync-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:5px;transition:all .3s}
.sync-dot-ic{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}
.sync-ok{background:rgba(52,199,89,.12);color:#059669}
.sync-ing{background:rgba(255,149,0,.12);color:#d97706}
.sync-err{background:rgba(255,59,48,.1);color:#dc2626}
.tb-logout{background:none;border:none;cursor:pointer;color:var(--red);padding:4px;display:flex;align-items:center}
.tb-logout svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ═══ CONTENT ═══ */
.page-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column}
#pagePS{flex:1;overflow:hidden;display:none;flex-direction:column}
#pagePS.on{display:flex}
#pagePS.on{display:flex}
#pageOV{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;display:none}
#pageOV.on{display:block}
#root{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ═══ BOTTOM NAV ═══ */
.staff-nav{
  position:fixed;
  bottom:max(16px,env(safe-area-inset-bottom,16px));
  left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:320px;
  height:62px;z-index:500;
  border-radius:999px;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 0 0 1px rgba(255,255,255,.6),0 8px 28px rgba(0,0,0,.14);
  display:flex;align-items:stretch;
  overflow:hidden;
}
.sn-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:none;background:none;cursor:pointer;font-family:inherit;
  font-size:10px;font-weight:600;color:var(--t3);gap:3px;
  touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,122,255,.1);
  transition:color .2s;
}
.sn-btn.on{color:var(--blue)}
.sn-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ═══ OVERLAY PAGE ═══ */
.ov-hero{
  background:linear-gradient(135deg,#1a1a2e,#2d2d44);
  border-radius:16px;padding:18px;margin-bottom:12px;color:#fff;
}
.ov-hero-title{font-size:17px;font-weight:800;margin-bottom:2px}
.ov-hero-clk{font-size:12px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
.ov-stats{display:flex;gap:8px;margin-top:12px}
.ov-stat{flex:1;background:rgba(255,255,255,.1);border-radius:10px;padding:10px;text-align:center}
.ov-stat .v{font-size:22px;font-weight:900}
.ov-stat .l{font-size:10px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:90px}
.ov-sc{border-radius:12px;padding:12px;position:relative;border:1.5px solid transparent}
.ov-sc.free{background:#f0fdf4;border-color:rgba(52,199,89,.2)}
.ov-sc.aktif{background:#fffbeb;border-color:rgba(255,149,0,.25)}
.ov-sc.warn{background:#fff0f0;border-color:rgba(255,59,48,.25);animation:warn-p .8s infinite alternate}
@keyframes warn-p{from{opacity:1}to{opacity:.75}}
.ov-badge{position:absolute;top:8px;right:8px;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700}
.ov-b-free{background:rgba(52,199,89,.15);color:#059669}
.ov-b-aktif{background:rgba(255,149,0,.15);color:#d97706}
.ov-b-warn{background:rgba(255,59,48,.15);color:#dc2626}
.ov-st-name{font-size:13px;font-weight:700}
.ov-st-type{font-size:10px;color:var(--t3)}
.ov-timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;margin:5px 0}
.t-g{color:var(--green)}.t-r{color:var(--red);animation:blink .8s infinite}.t-k{color:var(--t4)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.ov-info{font-size:11px;color:var(--t2);line-height:1.6}

/* ═══ TOAST ═══ */
.staff-toast{
  position:fixed;bottom:calc(62px + max(28px,env(safe-area-inset-bottom,28px)) + 8px);
  left:50%;transform:translateX(-50%) translateY(10px);
  background:rgba(0,0,0,.82);color:#fff;padding:9px 16px;border-radius:30px;
  font-size:13px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;
  white-space:nowrap;max-width:90vw;z-index:9998;backdrop-filter:blur(10px);
}
.staff-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.staff-toast.g{background:rgba(52,199,89,.9)}
.staff-toast.r{background:rgba(255,59,48,.9)}
.staff-toast.a{background:rgba(255,149,0,.9)}
.ps-wrap{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;color:var(--t1)}
.ps-wrap *{box-sizing:border-box}
.ps-hdr{background:rgba(255,255,255,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.6);padding:0 20px;display:flex;align-items:center;gap:0;height:54px;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04)}
.ps-hb{display:flex;align-items:center;gap:9px;margin-right:20px;flex-shrink:0}
.ps-hb .ico{width:32px;height:32px;background:linear-gradient(145deg,#1c1c2e,#2d2d44);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ps-hb .nm{font-size:14px;font-weight:800;letter-spacing:-.4px}
.ps-hnav{display:flex;gap:2px;flex:1;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.ps-hnav::-webkit-scrollbar{display:none}
.ps-ht{padding:6px 14px;border-radius:999px;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
.ps-ht:hover{background:rgba(0,0,0,.05);color:var(--t1)}
.ps-ht.on{background:#007aff;color:#fff;box-shadow:0 2px 8px rgba(0,122,255,.35)}
.ps-hst{display:flex;gap:6px;align-items:center;flex-shrink:0}
.ps-hsp{background:rgba(0,0,0,.05);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:5px;white-space:nowrap;border:1px solid rgba(255,255,255,.5)}
.ps-hclk{font-size:12px;font-weight:800;color:#007aff;font-family:'SF Mono','Courier New',monospace;letter-spacing:.5px;min-width:72px;text-align:right}
.ps-body{max-width:1440px;margin:0 auto;padding:20px 20px 48px}
.ps-card{background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.5);overflow:hidden;margin-bottom:16px}
.ps-ch{padding:18px 22px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ps-ct{font-size:18px;font-weight:800;letter-spacing:-.4px}
.ps-strip{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid rgba(0,0,0,.06)}
.ps-si{padding:14px 16px;text-align:center;border-right:1px solid rgba(0,0,0,.06)}
.ps-si:last-child{border-right:none}
.ps-sv{font-size:20px;font-weight:900;letter-spacing:-.5px}
.ps-sl{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.ps-sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:14px 22px 20px}
@media(max-width:1100px){.ps-sgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.ps-sgrid{grid-template-columns:repeat(2,1fr)}}
.ps-sc{background:rgba(255,255,255,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:16px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;position:relative;overflow:hidden}
.ps-sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:0}
.ps-sc.aktif::before{background:linear-gradient(90deg,#ff9500,#ffcc00)}
.ps-sc.tamat::before{background:linear-gradient(90deg,#ff3b30,#ff6b6b)}
.ps-sc.aktif{background:rgba(255,249,235,.85);border-color:rgba(255,149,0,.25)}
.ps-sc.tamat{background:rgba(255,59,48,.08);border-color:rgba(255,59,48,.25);animation:ps-pls 1.2s infinite}
.ps-sc:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.1)}
@keyframes ps-pls{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.18)}50%{box-shadow:0 0 0 8px rgba(255,59,48,0)}}
.ps-sct{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.ps-scn{font-size:14px;font-weight:800;letter-spacing:-.3px}
.ps-scs{font-size:11px;font-weight:600;color:var(--t2);margin-top:1px}
.ps-sbg{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.3px}
.ps-bg-k{background:rgba(0,0,0,.06);color:var(--t3)}
.ps-bg-a{background:rgba(255,149,0,.15);color:#ff9500}
.ps-bg-t{background:rgba(255,59,48,.12);color:#ff3b30}
.ps-stm{font-size:24px;font-weight:900;font-family:'SF Mono','Courier New',monospace;letter-spacing:2px;margin:8px 0}
.ps-tg{color:#34c759}.ps-tr{color:#ff3b30;animation:ps-blink .8s infinite}.ps-ty{color:var(--t3)}
@keyframes ps-blink{0%,100%{opacity:1}50%{opacity:.3}}
.ps-scm{font-size:11px;color:var(--t2);line-height:1.8}
.ps-scm .h{font-weight:700;color:var(--t1)}
.ps-scm .p{color:#007aff;font-weight:800}
.ps-scb{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.ps-bx{flex:1;padding:8px 6px;border:none;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;white-space:nowrap;letter-spacing:-.1px}
.ps-bk{background:#007aff;color:#fff;box-shadow:0 2px 8px rgba(0,122,255,.3)}
.ps-bk:hover{background:#0051d5;transform:scale(1.02)}
.ps-be{background:rgba(255,59,48,.12);color:#ff3b30;border:1px solid rgba(255,59,48,.2)}
.ps-be:hover{background:#ff3b30;color:#fff;box-shadow:0 4px 12px rgba(255,59,48,.3)}
.ps-bj{background:rgba(175,82,222,.12);color:#af52de;border:1px solid rgba(175,82,222,.2)}
.ps-bj:hover{background:#af52de;color:#fff;box-shadow:0 4px 12px rgba(175,82,222,.3)}
.ps-blay{display:grid;grid-template-columns:1fr 310px;gap:18px;padding:14px 22px 24px;align-items:start}
@media(max-width:900px){.ps-blay{grid-template-columns:1fr}}
.ps-fg{margin-bottom:16px}
.ps-fl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t2);margin-bottom:8px;display:block}
.ps-fi{width:100%;padding:11px 14px;border:1.5px solid rgba(0,0,0,.08);border-radius:12px;font-size:14px;font-family:inherit;color:var(--t1);background:rgba(255,255,255,.7);backdrop-filter:blur(12px);outline:none;transition:all .2s;-webkit-backdrop-filter:blur(12px)}
.ps-fi:focus{border-color:#007aff;background:rgba(255,255,255,.9);box-shadow:0 0 0 4px rgba(0,122,255,.1)}
.ps-tg-g{display:flex;flex-wrap:wrap;gap:7px}
.ps-tb{padding:9px 16px;border:1.5px solid rgba(0,0,0,.08);border-radius:12px;background:rgba(255,255,255,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--t2);transition:all .18s;display:flex;align-items:center;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ps-tb:hover:not(:disabled){border-color:#007aff;color:#007aff;background:rgba(0,122,255,.06);transform:translateY(-1px)}
.ps-tb.on{background:#007aff;border-color:#007aff;color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(0,122,255,.3)}
.ps-tb:disabled{opacity:.35;cursor:not-allowed}
.ps-tb-icon{font-size:15px}
.ps-tb.pay-cash.on{background:#34c759;border-color:#34c759;box-shadow:0 4px 12px rgba(52,199,89,.3)}
.ps-tb.pay-qr.on{background:#af52de;border-color:#af52de;box-shadow:0 4px 12px rgba(175,82,222,.3)}
.ps-tb.pay-fpx.on{background:#32ade6;border-color:#32ade6;box-shadow:0 4px 12px rgba(50,173,230,.3)}
.ps-ssb{padding:12px 6px;border:1.5px solid rgba(0,0,0,.08);border-radius:12px;background:rgba(255,255,255,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:center;cursor:pointer;font-family:inherit;transition:all .18s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ps-ssb:hover:not(:disabled){border-color:#007aff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.ps-ssb.on{background:#007aff;border-color:#007aff;color:#fff;box-shadow:0 4px 14px rgba(0,122,255,.35)}
.ps-ssb:disabled{opacity:.3;cursor:not-allowed}
.ps-nb{padding:9px 16px;border:1.5px solid #007aff;border-radius:12px;background:rgba(0,122,255,.08);color:#007aff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;backdrop-filter:blur(12px)}
.ps-nb:hover{background:#007aff;color:#fff;box-shadow:0 4px 12px rgba(0,122,255,.3)}
.ps-lyw{display:flex;align-items:center;gap:9px;padding:12px 14px;background:rgba(52,199,89,.1);border:1.5px solid rgba(52,199,89,.25);border-radius:12px;margin-bottom:14px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .18s}
.ps-lyw:hover{background:rgba(52,199,89,.15)}
.ps-lyw input{width:16px;height:16px;cursor:pointer;accent-color:#34c759}
.ps-lyw label{font-size:13px;font-weight:700;color:#34c759;cursor:pointer}
.ps-rcard{background:rgba(255,255,255,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.6);border-radius:16px;position:sticky;top:66px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.6)}
.ps-rh{padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.06);font-size:13px;font-weight:800;background:rgba(255,255,255,.4)}
.ps-rbody{padding:14px 18px}
.ps-rr{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;color:var(--t2);line-height:1.4}
.ps-rr .rv{font-weight:700;color:var(--t1)}
.ps-rr.tot{border-top:1.5px dashed rgba(0,0,0,.1);padding-top:12px;margin-top:6px;font-size:15px;font-weight:900}
.ps-rr.tot .rv{color:#007aff;font-size:17px}
.ps-rr.ly{color:#34c759}.ps-rr.pk{color:#ff9500}
.ps-svbtn{width:100%;padding:14px;border:none;background:linear-gradient(135deg,#007aff,#0051d5);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;letter-spacing:-.2px}
.ps-svbtn:hover{opacity:.9;letter-spacing:0}
.ps-tw{overflow-x:auto;border-radius:16px}
.ps-dt{width:100%;border-collapse:collapse;font-size:13px}
.ps-dt th{background:rgba(0,0,0,.03);padding:11px 13px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t2);border-bottom:1px solid rgba(0,0,0,.06);white-space:nowrap}
.ps-dt td{padding:10px 13px;border-bottom:1px solid rgba(0,0,0,.04);vertical-align:middle}
.ps-dt tr:hover td{background:rgba(0,122,255,.03)}

<script>
'use strict';

// ═══════════════════════════════════════════════
// AUTH — Simple, no conflict
// ═══════════════════════════════════════════════
const USERS2 = [
  { u:'staff', p:'staff123', name:'Staff'  },
  { u:'admin', p:'777',      name:'Admin'  },
  { u:'operator', p:'ops123', name:'Operator' },
];
let _staff = null;
let _curTab = 0;

function staffLogin() {
  var uEl = document.getElementById('lgUser');
  var pEl = document.getElementById('lgPass');
  var errEl = document.getElementById('lgErr');
  var u = (uEl.value||'').trim().toLowerCase();
  var p = (pEl.value||'');
  errEl.style.display = 'none';
  if (!u || !p) { showLgErr('Please fill in all fields'); return; }
  var found = USERS2.find(function(x){ return x.u === u && x.p === p; });
  if (!found) { showLgErr('Incorrect username or password'); return; }
  _staff = found;
  localStorage.setItem('_staff2_session', JSON.stringify({ u: found.u, ts: Date.now() }));
  document.getElementById('scLogin').style.display = 'none';
  document.getElementById('scApp').classList.add('on');
  document.getElementById('tbUser').textContent = found.name;
  startApp();
}

function staffLogout() {
  if (!confirm('Log keluar dari Staff Portal?')) return;
  _staff = null;
  localStorage.removeItem('_staff2_session');
  document.getElementById('scApp').classList.remove('on');
  document.getElementById('scLogin').style.display = 'flex';
  document.getElementById('lgUser').value = '';
  document.getElementById('lgPass').value = '';
}

function showLgErr(msg) {
  var el = document.getElementById('lgErr');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(function(){ el.style.display='none'; }, 3500);
}

function togglePw() {
  var i = document.getElementById('lgPass');
  var h = i.type === 'password';
  i.type = h ? 'text' : 'password';
  document.getElementById('eyeSvg').innerHTML = h
    ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}

// Auto-restore session
window.addEventListener('load', function() {
  try {
    var s = JSON.parse(localStorage.getItem('_staff2_session'));
    if (s && s.u && (Date.now() - s.ts) < 86400000 * 7) {
      var f = USERS2.find(function(x){ return x.u === s.u; });
      if (f) {
        _staff = f;
        document.getElementById('scLogin').style.display = 'none';
        document.getElementById('scApp').classList.add('on');
        document.getElementById('tbUser').textContent = f.name;
        startApp();
        return;
      }
    }
  } catch(e) {}
  document.getElementById('scLogin').style.display = 'flex';
});

// ═══════════════════════════════════════════════
// TAB NAVIGATION
// ═══════════════════════════════════════════════
function goTab(n) {
  _curTab = n;
  [document.getElementById('pagePS'), document.getElementById('pageOV')].forEach(function(el, i) {
    el.classList.toggle('on', i === n);
  });
  [document.getElementById('sn0'), document.getElementById('sn1')].forEach(function(b, i) {
    b.classList.toggle('on', i === n);
  });
  if (n === 0) { setTimeout(function(){ if(typeof renderPsBooking==='function') renderPsBooking(); }, 30); }
  if (n === 1) renderOverlay();
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
var _tTimer;
function sToast(msg, cls) {
  var el = document.getElementById('sToast');
  el.textContent = msg;
  el.className = 'staff-toast show' + (cls ? ' ' + cls : '');
  clearTimeout(_tTimer);
  _tTimer = setTimeout(function(){ el.className = 'staff-toast'; }, 3500);
}
// Override psToast
window.psToast = sToast;

// ═══════════════════════════════════════════════
// SYNC STATUS
// ═══════════════════════════════════════════════
function showSyncStatus(state, msg) {
  var el = document.getElementById('syncPill');
  var tx2 = document.getElementById('syncTxt');
  if (!el) return;
  el.className = 'sync-pill';
  if (state === 'syncing') {
    el.classList.add('sync-ing');
    tx2.textContent = 'Menyimpan...';
  } else if (state === 'ok') {
    el.classList.add('sync-ok');
    tx2.textContent = 'Tersimpan';
  } else {
    el.classList.add('sync-err');
    tx2.textContent = msg || 'Offline';
  }
}

// ═══════════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════════
const FB_BASE = 'https://maidalegacy-1fe56-default-rtdb.asia-southeast1.firebasedatabase.app';
var _fbOnline = true;

async function fbGet(path) {
  try {
    var ctrl = new AbortController();
    setTimeout(function(){ ctrl.abort(); }, 8000);
    var r = await fetch(FB_BASE + '/' + path + '.json', { signal: ctrl.signal });
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { _fbOnline = false; return null; }
}

async function fbSet(path, data) {
  if (data && typeof data === 'object') data._ts = Date.now();
  try {
    var ctrl = new AbortController();
    setTimeout(function(){ ctrl.abort(); }, 12000);
    var r = await fetch(FB_BASE + '/' + path + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
      signal: ctrl.signal
    });
    _fbOnline = r.ok;
    return r.ok;
  } catch(e) { _fbOnline = false; return false; }
}

// ═══════════════════════════════════════════════
// PS BOOKING DATA SYNC
// ═══════════════════════════════════════════════
const PS_SK = 'psbook_v1';
var _pollTimer = null;

async function loadPSData() {
  // Local first
  try {
    var ls = JSON.parse(localStorage.getItem(PS_SK));
    if (ls && ls.bks) { ps_bks = ls.bks || []; ps_nid = ls.nid || 1; }
  } catch(e) {}
  // Then Firebase
  try {
    var cloud = await fbGet('mde/psbooking');
    if (cloud && cloud.bks) {
      var lsIds = new Set(ps_bks.map(function(b){ return String(b.id); }));
      var cloudOnly = cloud.bks.filter(function(b){ return !lsIds.has(String(b.id)); });
      if (cloud.bks.length >= ps_bks.length) {
        ps_bks = cloud.bks;
        ps_nid = cloud.nid || ps_nid;
      } else if (cloudOnly.length > 0) {
        ps_bks = ps_bks.concat(cloudOnly);
      }
      localStorage.setItem(PS_SK, JSON.stringify({ bks: ps_bks, nid: ps_nid, _ts: Date.now() }));
      _fbOnline = true;
    }
  } catch(e) { _fbOnline = false; }
}

// Override psSave - applied after PS inject loads
window.addEventListener('load', function() {
  // Override psSave to sync with Firebase
  if (typeof ps_bks !== 'undefined') {
    window.psSave = function() {
      localStorage.setItem(PS_SK, JSON.stringify({ bks: ps_bks, nid: ps_nid, _ts: Date.now() }));
      showSyncStatus('syncing');
      fbSet('mde/psbooking', { bks: ps_bks, nid: ps_nid }).then(function(ok) {
        showSyncStatus(ok ? 'ok' : 'error');
      });
    };
  }
});

// Also define psSave for immediate use
function psSave() {
  localStorage.setItem(PS_SK, JSON.stringify({ bks: ps_bks, nid: ps_nid, _ts: Date.now() }));
  showSyncStatus('syncing');
  fbSet('mde/psbooking', { bks: ps_bks, nid: ps_nid }).then(function(ok) {
    showSyncStatus(ok ? 'ok' : 'error');
  });
}

function startPolling() {
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(async function() {
    try {
      var cloud = await fbGet('mde/psbooking');
      if (!cloud || !cloud.bks) return;
      var cloudTs = cloud._ts || 0;
      var local = JSON.parse(localStorage.getItem(PS_SK) || '{}');
      var localTs = local._ts || 0;
      if (cloudTs > localTs + 1000) {
        ps_bks = cloud.bks;
        ps_nid = cloud.nid || ps_nid;
        localStorage.setItem(PS_SK, JSON.stringify({ bks: ps_bks, nid: ps_nid, _ts: cloudTs }));
        if (_curTab === 0) renderPsBooking();
        else renderOverlay();
      }
    } catch(e) {}
  }, 5000);
}

window.addEventListener('storage', function(e) {
  if (e.key === PS_SK && e.newValue) {
    try {
      var d = JSON.parse(e.newValue);
      if (d && d.bks) {
        ps_bks = d.bks; ps_nid = d.nid || ps_nid;
        if (_curTab === 0) renderPsBooking();
        else renderOverlay();
      }
    } catch(err) {}
  }
});

// ═══════════════════════════════════════════════
// OVERLAY
// ═══════════════════════════════════════════════
function p2(n){ return String(+n||0).padStart(2,'0'); }
function getRemMs(b){ if(!b||!b.et)return 0; var e=new Date(b.et); return isNaN(e.getTime())?0:e.getTime()-Date.now(); }
function fmtCd(ms){ if(!ms||ms<=0)return'--:--:--'; return[Math.floor(ms/3600000),Math.floor((ms%3600000)/60000),Math.floor((ms%60000)/1000)].map(function(n){return p2(n);}).join(':'); }
function fmtT2(iso){ if(!iso)return'-'; try{ var d=new Date(iso); var m=new Date(d.getTime()+d.getTimezoneOffset()*60000+28800000); var h=m.getHours(),mn=m.getMinutes(),ap=h>=12?'PM':'AM'; h=h%12||12; return p2(h)+':'+p2(mn)+' '+ap; }catch(e){return'-';} }

var _ovClk = null;
function renderOverlay() {
  var now = Date.now();
  var sts = typeof PS_STATIONS !== 'undefined' ? PS_STATIONS : [];
  var free=0, aktif=0;
  var d = new Date(now + new Date().getTimezoneOffset()*60000 + 28800000);
  var clk = p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());

  var cards = sts.map(function(s) {
    var b = ps_bks.find(function(bk){ return bk.sid===s.id && bk.status==='a' && new Date(bk.st)<=now && new Date(bk.et)>now; });
    var rem = b ? getRemMs(b) : 0;
    var isWarn = b && rem > 0 && rem < 300000;
    var isFree = !b || rem <= 0;
    if(isFree) free++; else aktif++;
    var cls = isFree?'free':isWarn?'warn':'aktif';
    var badge = isFree?'<span class="ov-badge ov-b-free">Kosong</span>':isWarn?'<span class="ov-badge ov-b-warn">⚠️ Hampir</span>':'<span class="ov-badge ov-b-aktif">Aktif</span>';
    return '<div class="ov-sc '+cls+'">'+badge+'<div class="ov-st-name">Station '+s.id+'</div><div class="ov-st-type">'+s.type+'</div><div class="ov-timer '+(isFree?'t-k':isWarn?'t-r':'t-g')+'" id="ovtm'+s.id+'">'+(isFree?'--:--:--':fmtCd(rem))+'</div><div class="ov-info">'+(b?'Tamat: '+fmtT2(b.et)+'<br>'+b.players+'P · '+(b.payment||'cash').toUpperCase()+'<br>RM '+Number(b.amt||0).toFixed(2):'')+'</div></div>';
  }).join('');

  document.getElementById('ovContent').innerHTML = '<div class="ov-hero"><div class="ov-hero-title">🎮 MAIDA ESPORTS</div><div class="ov-hero-clk" id="ovClk">'+clk+'</div><div class="ov-stats"><div class="ov-stat"><div class="v" style="color:#34d399">'+free+'</div><div class="l">Kosong</div></div><div class="ov-stat"><div class="v" style="color:#fbbf24">'+aktif+'</div><div class="l">Aktif</div></div><div class="ov-stat"><div class="v">'+sts.length+'</div><div class="l">Stesen</div></div></div></div><div class="ov-grid">'+cards+'</div>';
}

function startOvClock() {
  if (_ovClk) clearInterval(_ovClk);
  _ovClk = setInterval(function() {
    if (_curTab === 1) {
      var clkEl = document.getElementById('ovClk');
      if (clkEl) {
        var d = new Date(Date.now() + new Date().getTimezoneOffset()*60000 + 28800000);
        clkEl.textContent = p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
      }
      // Update timers only
      if (typeof PS_STATIONS !== 'undefined') {
        PS_STATIONS.forEach(function(s) {
          var b = ps_bks.find(function(bk){ return bk.sid===s.id&&bk.status==='a'&&new Date(bk.st)<=Date.now()&&new Date(bk.et)>Date.now(); });
          var el = document.getElementById('ovtm'+s.id);
          if (el) el.textContent = b ? fmtCd(getRemMs(b)) : '--:--:--';
        });
      }
    }
  }, 1000);
}

var tx=[], cats={income:[],expense:[]}, notes={};
var curDate = new Date().toISOString().slice(0,10);

// ═══════════════════════════════════════════════
// psConfirm2 — persistent modal
// ═══════════════════════════════════════════════
function psConfirm2(t,s,cls,cb) {
  var modal = document.getElementById('ps-modal-p2');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'ps-modal-p2';
    modal.innerHTML = '<div class="ps-mbox"><div class="ps-mt2" id="ps-mT-p2"></div><div class="ps-ms2" id="ps-mS-p2"></div><div class="ps-mbtns"><button class="ps-mb ps-mb-c" onclick="psCloseModal()">Batal</button><button class="ps-mb" id="ps-mOk-p2">Sahkan</button></div></div>';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px';
    document.body.appendChild(modal);
  }
  document.getElementById('ps-mT-p2').textContent = t;
  document.getElementById('ps-mS-p2').innerHTML = s;
  var btn = document.getElementById('ps-mOk-p2');
  btn.className = 'ps-mb ' + (cls||'ps-mb-ok');
  btn.onclick = null;
  btn.addEventListener('click', function _h(){ btn.removeEventListener('click',_h); psCloseModal(); try{cb();}catch(e){console.error(e);} }, {once:true});
  modal.style.display = 'flex';
}
function psCloseModal() {
  var m = document.getElementById('ps-modal-p2'); if(m) m.style.display='none';
  var o = document.getElementById('ps-modal'); if(o) o.classList.remove('show');
}

// ═══════════════════════════════════════════════
// START APP
// ═══════════════════════════════════════════════
function startApp() {
  loadPSData().then(function() {
    // Init PS state before rendering
    if (typeof psMyToday === 'function') {
      ps_pDate = psMyToday();
      ps_lDate = psMyToday();
    } else {
      var now = new Date();
      var my = new Date(now.getTime() + now.getTimezoneOffset()*60000 + 28800000);
      var ds = my.getFullYear()+'-'+String(my.getMonth()+1).padStart(2,'0')+'-'+String(my.getDate()).padStart(2,'0');
      ps_pDate = ds;
      ps_lDate = ds;
    }
    ps_av = 'panel';
    goTab(0);
    // Small delay to ensure DOM is ready after goTab shows the page
    setTimeout(function() {
      renderPsBooking();
    }, 50);
    startPolling();
    startOvClock();
    sToast('Selamat datang, ' + (_staff ? _staff.name : 'Staff') + '! 👋', 'g');
  });
}
</script>

<script id="ps-inject">
const PS_STATIONS=Array.from({length:12},(_,i)=>({id:i+1,name:`Station ${i+1}`,type:i<5?'PS5':i<10?'PS4':'eRacing'}));
const PS_JOY_PRICE={PS5:8,PS4:5,eRacing:0};
let PS_RATES={PS5:{1:{1:10,2:18,3:25},2:{1:15,2:25,3:30}},PS4:{1:{1:7,2:13,3:18},2:{1:10,2:15,3:20}},eRacing:{1:{1:15,2:25,3:30}}};
let PS_DISCOUNTS={pct:0,types:{}};
let PS_PROMO_WEEKDAY={enabled:false,startH:10,endH:13,rates:{PS5:{1:8,2:12},PS4:{1:5,2:8},eRacing:{1:12}}};
let PS_PEAK={enabled:false,hours:[{start:17,end:22,label:'Malam',mult:1.2}]};
let ps_priceEditMode=false;
let ps_bks=[],ps_nid=1,ps_av='panel',ps_pDate='',ps_lDate='',ps_aDate='',ps_aMonth='';
let ps_aledIds=new Set(),ps_aled5=new Set();
let ps_bF={},ps_tmRef=null;
let ps_lFilt={period:'today',status:'all',type:'all',payment:'all'};

function psMyNow(){const n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+28800000);}
function psMyToday(){const d=psMyNow();return`${d.getFullYear()}-${psMy2(d.getMonth()+1)}-${psMy2(d.getDate())}`;}
function psMyDtLocal(){const d=psMyNow();return`${d.getFullYear()}-${psMy2(d.getMonth()+1)}-${psMy2(d.getDate())}T${psMy2(d.getHours())}:${psMy2(d.getMinutes())}`;}
function psParseMY(s){if(!s)return new Date();const p=s.replace('T',' ').split(/[- :]/);return new Date(Date.UTC(+p[0],+p[1]-1,+p[2],+p[3]-8,+(p[4]||0),0));}
function psMyHour(iso){const d=new Date(iso);if(isNaN(d.getTime()))return 0;const my=new Date(d.getTime()+d.getTimezoneOffset()*60000+28800000);return my.getHours();}
function psMy2(n){return String(+n||0).padStart(2,'0');}
function psFmtT(iso){if(!iso)return'-';try{const d=new Date(iso);if(isNaN(d.getTime()))return'-';const my=new Date(d.getTime()+d.getTimezoneOffset()*60000+28800000);let h=my.getHours(),m=my.getMinutes(),ap=h>=12?'PM':'AM';h=h%12||12;return`${psMy2(h)}:${psMy2(m)} ${ap}`;}catch(e){return'-';}}
function psFmtDate(s){if(!s)return'-';const mn=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'],p=s.split('-');return`${+p[2]} ${mn[+p[1]-1]} ${p[0]}`;}
function psFmtMon(s){if(!s)return'-';const mn=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'],p=s.split('-');return`${mn[+p[1]-1]} ${p[0]}`;}
function psGetRemMs(b){if(!b||!b.et)return 0;const e=new Date(b.et);return isNaN(e.getTime())?0:e.getTime()-new Date().getTime();}
function psFmtCd(ms){if(!ms||isNaN(ms)||ms<=0)return'00:00:00';return[Math.floor(ms/3600000),Math.floor((ms%3600000)/60000),Math.floor((ms%60000)/1000)].map(n=>psMy2(n)).join(':');}

function psNb(){return{players:1,payment:'cash',joy:1,dur:1,st:psMyDtLocal(),loyalty:false,lref:'',notes:'',xDS4:0,xDS5:0};}

function psCalcBase(sid,players,dur,loyalty,isoSt){
  if(loyalty)return 0;
  const s=PS_STATIONS.find(x=>x.id===sid);if(!s)return 0;
  // eRacing: 1 player only
  const effPlayers=s.type==='eRacing'?1:players;
  let base=PS_RATES[s.type]?.[effPlayers]?.[dur]||0;
  if(PS_PEAK.enabled&&isoSt){const h=psMyHour(isoSt);const pk=PS_PEAK.hours.find(p=>h>=p.start&&h<p.end);if(pk)base=Math.round(base*pk.mult);}
  if(PS_PROMO_WEEKDAY.enabled&&isoSt){const d=new Date(psParseMY(isoSt));const my=new Date(d.getTime()+d.getTimezoneOffset()*60000+28800000);const dow=my.getDay();const h=my.getHours();if(dow>=1&&dow<=5&&h>=PS_PROMO_WEEKDAY.startH&&h<PS_PROMO_WEEKDAY.endH){const st=PS_STATIONS.find(x=>x.id===sid);const promoRate=st?PS_PROMO_WEEKDAY.rates[st.type]?.[players]:null;if(promoRate!=null)return promoRate;}}
  if(PS_DISCOUNTS.pct>0)base=Math.round(base*(1-PS_DISCOUNTS.pct/100));
  return base;
}
function psCalcX(f){const _xst=PS_STATIONS.find(function(s){return s.id===f.sid;});
if(_xst&&_xst.type==='eRacing')return 0;
let x=0;x+=(f.xDS4||0)*5;x+=(f.xDS5||0)*8;return x;}
function psCalcTot(f){return psCalcBase(f.sid,f.players,f.dur,f.loyalty,f.st)+psCalcX(f);}
function psGetAB(sid,date){return ps_bks.filter(b=>b.sid===sid&&b.date===date&&b.status!=='x').sort((a,b)=>new Date(b.st)-new Date(a.st))[0]||null;}
function psIsBusy(sid,excl=null){const now=Date.now();return ps_bks.some(b=>b.sid===sid&&b.status==='a'&&new Date(b.st)<=now&&new Date(b.et)>now&&b.id!==excl);}
function psHasOvlp(sid,date,st,et,excl=null){const s=new Date(st).getTime(),e=new Date(et).getTime();return ps_bks.some(b=>b.sid===sid&&b.date===date&&b.status==='a'&&b.id!==excl&&s<new Date(b.et).getTime()&&e>new Date(b.st).getTime());}

function psConfirm2(t,s,cls,cb){

// Beep & Speak
function psBeep(secs){try{const ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=0;const now=ac.currentTime,bip=0.2,gap=0.3;for(let i=0;i<Math.ceil(secs/(bip+gap));i++){g.gain.setValueAtTime(.3,now+i*(bip+gap));g.gain.setValueAtTime(0,now+i*(bip+gap)+bip);}o.start();o.stop(now+secs);}catch(e){}}
function psSpeak(txt){try{const u=new SpeechSynthesisUtterance(txt);u.lang='ms-MY';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

function psQBook(sid){ps_bF=psNb();ps_bF.sid=sid;psSv('booking');}

function psPanelAdd1h(id){
  const b=ps_bks.find(b=>b.id===id);if(!b)return;
  const st=PS_STATIONS.find(s=>s.id===b.sid);
  const type=st?.type||'PS5';
  const players=b.players||1;
  const oldDur=b.dur||1;
  const newDur=oldDur+1;
  const oldAmt=b.amt;
  // Calculate new amount using package pricing
  const xtra=psCalcX(b);
  let newBase;
  if(newDur<=3){
    newBase=b.loyalty?0:(PS_RATES[type]?.[players]?.[newDur]||0);
  }else{
    const base3=b.loyalty?0:(PS_RATES[type]?.[players]?.[3]||0);
    const rate1=PS_RATES[type]?.[players]?.[1]||0;
    newBase=base3+((newDur-3)*rate1);
  }
  const newAmt=newBase+xtra;
  const diff=newAmt-oldAmt;

  psConfirm2(
    '⏰ Tambah 1 Jam',
    `<strong>${st?.name} (${type})</strong><br>
    ${players} Player · Dari ${oldDur}j → <strong>${newDur}j</strong><br><br>
    Harga semasa: <span style="text-decoration:line-through;color:#9ca3af">RM ${oldAmt.toFixed(2)}</span><br>
    Harga baru: <strong style="color:#007aff;font-size:16px">RM ${newAmt.toFixed(2)}</strong><br>
    <small style="color:#6b7280">${newDur<=3?`Pakej ${newDur}j digunakan`:`Pakej 3j + tambahan ${newDur-3}j`}${diff>0?` · Tambah RM${diff.toFixed(2)}`:' · Jimat dengan pakej!'}</small>`,
    'ps-mb-ok',
    ()=>{
      psAdd1h(id);
      psRPanel();
    }
  );
}

// List
function psGetFilteredList(){
  const now=new Date(),todStr=psMyToday();const d=psMyNow();
  const weekStart=new Date(d);weekStart.setDate(d.getDate()-d.getDay());
  const wStr=`${weekStart.getFullYear()}-${psMy2(weekStart.getMonth()+1)}-${psMy2(weekStart.getDate())}`;
  const monStr=`${d.getFullYear()}-${psMy2(d.getMonth()+1)}`;
  let fil=ps_bks.filter(b=>b.status!=='x');
  // If status filter is 'batal', show cancelled instead
  if(ps_lFilt.status==='batal'){fil=ps_bks.filter(b=>b.status==='x');}
  if(ps_lFilt.period==='today')fil=fil.filter(b=>b.date===todStr);
  else if(ps_lFilt.period==='semalam'){const semalam=new Date(psMyNow());semalam.setDate(semalam.getDate()-1);const semalStr=`${semalam.getFullYear()}-${psMy2(semalam.getMonth()+1)}-${psMy2(semalam.getDate())}`;fil=fil.filter(b=>b.date===semalStr);}
  else if(ps_lFilt.period==='week')fil=fil.filter(b=>b.date>=wStr);
  else if(ps_lFilt.period==='month')fil=fil.filter(b=>b.date.startsWith(monStr));
  else if(ps_lFilt.period==='custom')fil=fil.filter(b=>b.date===ps_lDate);
  // 'all' = no date filter applied
  if(ps_lFilt.status==='aktif')fil=fil.filter(b=>b.status==='a');
  else if(ps_lFilt.status==='selesai')fil=fil.filter(b=>b.status==='s');
  // batal already filtered above
  if(ps_lFilt.type==='ps5')fil=fil.filter(b=>PS_STATIONS.find(s=>s.id===b.sid)?.type==='PS5');
  else if(ps_lFilt.type==='ps4')fil=fil.filter(b=>PS_STATIONS.find(s=>s.id===b.sid)?.type==='PS4');
  else if(ps_lFilt.type==='1p')fil=fil.filter(b=>b.players===1);
  else if(ps_lFilt.type==='2p')fil=fil.filter(b=>b.players===2);
  else if(ps_lFilt.type==='er')fil=fil.filter(b=>PS_STATIONS.find(s=>s.id===b.sid)?.type==='eRacing');
  if(ps_lFilt.payment!=='all')fil=fil.filter(b=>(b.payment||'cash')===ps_lFilt.payment);
  return fil.sort((a,b)=>new Date(b.st)-new Date(a.st));
}

// Hantar Sewaan ke Transaksi
function psHantarKeTransaksi(){
  const fil=psGetFilteredList();
  const todStr=psMyToday();

  // Determine the date label for display
  let tarikh=todStr;
  let periodeLabel='Hari Ini';
  if(ps_lFilt.period==='custom'&&ps_lDate){tarikh=ps_lDate;periodeLabel=psFmtDate(ps_lDate);}
  else if(ps_lFilt.period==='today'){tarikh=todStr;periodeLabel='Hari Ini ('+psFmtDate(todStr)+')';}
  else if(ps_lFilt.period==='week'){tarikh=todStr;periodeLabel='Minggu Ini';}
  else if(ps_lFilt.period==='month'){tarikh=todStr;periodeLabel='Bulan Ini';}

  const tot=fil.reduce((s,b)=>s+b.amt,0);
  if(tot<=0){psToast('Tiada jumlah untuk dihantar','r');return;}

  // Show confirmation modal with details
  const pAmt={'cash':0,'qr':0,'fpx':0};
  fil.forEach(b=>pAmt[b.payment||'cash']=(pAmt[b.payment||'cash']||0)+b.amt);
  const breakdown=`💵 Cash: RM${pAmt.cash.toFixed(2)} · 📱 QR: RM${pAmt.qr.toFixed(2)} · 🏦 FPX: RM${pAmt.fpx.toFixed(2)}`;

  psConfirm2(
    '🎮 Hantar ke Transaksi',
    `<strong>Periode:</strong> ${periodeLabel}<br><strong>Rekod:</strong> ${fil.length} sesi<br><strong>Jumlah:</strong> <span style="color:#007aff;font-weight:900">RM ${tot.toFixed(2)}</span><br><small style="color:#888">${breakdown}</small><br><br>Akan direkodkan sebagai:<br><strong>Income · 🏪 Sewaan Station</strong><br>pada tarikh <strong>${psFmtDate(tarikh)}</strong><br><br>Rekod sedia ada pada tarikh yang sama akan <strong>dikemas kini</strong> (bukan ditambah berganda).`,
    'ps-mb-ok',
    ()=>psSyncToTransaksi(tarikh,tot,fil.length,periodeLabel)
  );
}

function psSyncToTransaksi(tarikh,tot,count,periodeLabel){
  // Check if there's already a PS Booking entry for this date+desc
  const existingIdx=tx.findIndex(t=>
    t.date===tarikh &&
    t.type==='income' &&
    t.category==='🏪 Sewaan Station' &&
    (t.desc||'').startsWith('PS Booking')
  );

  const desc=`PS Booking · ${count} sesi · ${periodeLabel}`;

  if(existingIdx!==-1){
    // Update existing
    tx[existingIdx].amount=tot;
    tx[existingIdx].desc=desc;
    saveAll();
    psToast(`✅ Dikemas kini: Sewaan Station · RM ${tot.toFixed(2)}`,'g');
  }else{
    // Add new
    tx.push({id:Date.now()+Math.random(),date:tarikh,type:'income',amount:tot,category:'🏪 Sewaan Station',desc});
    saveAll();
    psToast(`✅ Dihantar ke Transaksi: RM ${tot.toFixed(2)}`,'g');
  }
  setTimeout(()=>achCheckAndFirework(), 800);
  // Switch to calendar tab to show the result
  setTimeout(()=>{
    switchTab('calendar');
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab==='calendar'));
  },1200);
}

function psAdd1h(id){
  const b=ps_bks.find(b=>b.id===id);if(!b)return;
  const st=PS_STATIONS.find(s=>s.id===b.sid);
  const type=st?.type||'PS5';
  const players=b.players||1;
  const oldDur=b.dur||1;
  const newDur=oldDur+1;

  // Calculate OLD base price (before extension)
  const oldBase=psCalcBase(b.sid,players,oldDur,b.loyalty,b.st);
  // Calculate NEW base price with new duration
  // If new duration > 3 (max pakej), tambah harga 1 jam biasa
  let newBase;
  if(newDur<=3){
    // Use package rate — newDur jam
    newBase=b.loyalty?0:(PS_RATES[type]?.[players]?.[newDur]||0);
  }else{
    // Beyond 3 jam — add 1 jam rate on top of 3-jam package
    const base3=b.loyalty?0:(PS_RATES[type]?.[players]?.[3]||0);
    const rate1=PS_RATES[type]?.[players]?.[1]||0;
    newBase=base3+((newDur-3)*rate1);
  }

  // Extras (DS4/DS5) remain same
  const xtra=psCalcX(b);
  const newAmt=newBase+xtra;

  b.et=new Date(new Date(b.et).getTime()+3600000).toISOString();
  b.dur=newDur;
  b.amt=newAmt;

  psSave();

  // Show what changed
  const diff=newAmt-(oldBase+xtra);
  const msg=newDur<=3
    ?`✅ +1j → ${newDur}j | RM${(oldBase+xtra).toFixed(2)} → RM${newAmt.toFixed(2)} (pakej ${newDur}j)`
    :`✅ +1j → ${newDur}j | +RM${diff.toFixed(2)} (kadar 1j)`;
  psToast(msg,'g');

  if(ps_av==='senarai')psRList();
  else if(ps_av==='panel')psRPanel();
}

function psBatalBk(id){

// Analisis
function psRAnalFull(){
  const dayFil=ps_bks.filter(b=>b.date===ps_aDate&&b.status!=='x');
  const dayTot=dayFil.reduce((s,b)=>s+b.amt,0);
  const ps5bks=dayFil.filter(b=>PS_STATIONS.find(s=>s.id===b.sid)?.type==='PS5');
  const ps4bks=dayFil.filter(b=>PS_STATIONS.find(s=>s.id===b.sid)?.type==='PS4');
  const erBks=dayFil.filter(b=>PS_STATIONS.find(s=>s.id===b.sid)?.type==='eRacing');
  const ps5r=ps5bks.reduce((s,b)=>s+b.amt,0);
  const ps4r=ps4bks.reduce((s,b)=>s+b.amt,0);
  const erR=erBks.reduce((s,b)=>s+b.amt,0);
  const p1r=dayFil.filter(b=>b.players===1).reduce((s,b)=>s+b.amt,0);
  const p2r=dayFil.filter(b=>b.players===2).reduce((s,b)=>s+b.amt,0);
  const cashR=dayFil.filter(b=>(b.payment||'cash')==='cash').reduce((s,b)=>s+b.amt,0);
  const qrR=dayFil.filter(b=>b.payment==='qr').reduce((s,b)=>s+b.amt,0);
  const fpxR=dayFil.filter(b=>b.payment==='fpx').reduce((s,b)=>s+b.amt,0);

  // Helper: build a bar chart SVG-style using divs
  function mkBars(items,colorFn,H=100){
    const maxV=Math.max(...items.map(i=>i.v),1);
    return items.map(i=>{
      const ht=Math.max(i.v>0?6:2,Math.round((i.v/maxV)*H));
      const col=typeof colorFn==='function'?colorFn(i):colorFn;
      return`<div class="ps-bc" style="min-width:${Math.max(28,Math.floor(520/items.length))}px">
        <div class="ps-bv">${i.v>0?'RM'+Math.round(i.v):''}</div>
        <div class="ps-bb" style="height:${ht}px;background:${col}" data-v="RM${i.v.toFixed(2)}${i.sub?(' · '+i.sub):''}"></div>
        <div class="ps-bl">${i.lbl}</div>
      </div>`;
    }).join('');
  }

  // ── Hasil per Station
  const stBars=mkBars(PS_STATIONS.map(s=>{
    const v=dayFil.filter(b=>b.sid===s.id).reduce((a,b)=>a+b.amt,0);
    return{lbl:`St${s.id}`,v,sub:s.type};
  }),i=>i.sub==='PS5'?'#3b82f6':'#10b981',100);

  // ── Slot Masa
  const slotDef=[
    {lbl:'Pagi',col:'#f59e0b',test:h=>h>=9&&h<12},
    {lbl:'Petang',col:'#10b981',test:h=>h>=12&&h<17},
    {lbl:'Malam',col:'#8b5cf6',test:h=>h>=17&&h<22},
  ];
  const slotTot=slotDef.map(s=>({lbl:s.lbl,col:s.col,v:dayFil.filter(b=>s.test(psMyHour(b.st))).reduce((a,b)=>a+b.amt,0)}));
  const slotBars=mkBars(slotTot,i=>i.col,100);

  // ── 1P vs 2P
  const pvBars=mkBars([{lbl:'1P',v:p1r,col:'#3b82f6'},{lbl:'2P',v:p2r,col:'#ef4444'}],i=>i.col,100);

  // ── Kaedah Bayaran
  const payBars=mkBars([{lbl:'Cash',v:cashR,col:'#10b981'},{lbl:'QR',v:qrR,col:'#8b5cf6'},{lbl:'FPX',v:fpxR,col:'#06b6d4'}],i=>i.col,100);

  // ── PS5 vs PS4
  const psBars=mkBars([{lbl:'PS5',v:ps5r,col:'#3b82f6'},{lbl:'PS4',v:ps4r,col:'#10b981'}],i=>i.col,100);

  // ── Hasil Mengikut Jam
  const hrly={};for(let h=9;h<=22;h++)hrly[h]=0;
  dayFil.forEach(b=>{const h=psMyHour(b.st);if(hrly[h]!==undefined)hrly[h]+=b.amt;});
  const hrKeys=Object.keys(hrly);
  const maxHr=Math.max(...hrKeys.map(h=>hrly[h]),1);
  const H2=80;
  const hrBars=hrKeys.map(h=>{
    const v=hrly[h];const ht=Math.max(v>0?5:2,Math.round((v/maxHr)*H2));
    const col=+h>=10&&+h<12?'#f59e0b':+h>=12&&+h<17?'#10b981':+h>=17&&+h<20?'#8b5cf6':'#d1d5db';
    return`<div class="ps-bc" style="min-width:32px"><div class="ps-bv" style="font-size:8px">${v>0?'RM'+Math.round(v):''}</div><div class="ps-bb" style="height:${ht}px;background:${col}" data-v="RM${v.toFixed(2)}"></div><div class="ps-bl" style="font-size:8px">${h}:00</div></div>`;
  }).join('');

  // ── Monthly
  const selYear=+ps_aMonth.split('-')[0];const selMon=+ps_aMonth.split('-')[1]-1;
  const months=[];for(let i=11;i>=0;i--){const d=new Date(selYear,selMon-i,1);months.push(`${d.getFullYear()}-${psMy2(d.getMonth()+1)}`);}
  const monRev={};const monCnt={};const monPS5={};const monPS4={};
  months.forEach(m=>{monRev[m]=0;monCnt[m]=0;monPS5[m]=0;monPS4[m]=0;});
  ps_bks.filter(b=>b.status!=='x').forEach(b=>{
    const m=b.date.slice(0,7);
    if(monRev[m]!==undefined){
      monRev[m]+=b.amt;monCnt[m]++;
      const stype=PS_STATIONS.find(s=>s.id===b.sid)?.type;
      if(stype==='PS5')monPS5[m]+=b.amt;else monPS4[m]+=b.amt;
    }
  });
  const maxMon=Math.max(...months.map(m=>monRev[m]),1);const HM=100;
  const monBars=months.map((m,i)=>{
    const v=monRev[m];const ht=Math.max(v>0?5:2,Math.round((v/maxMon)*HM));
    const isCurrent=i>=months.length-3;
    return`<div class="ps-bc"><div class="ps-bv">${v>0?'RM'+Math.round(v):''}</div><div class="ps-bb" style="height:${ht}px;background:${isCurrent?'#2563eb':'#93c5fd'}" data-v="RM${v.toFixed(2)} (${monCnt[m]} bk)"></div><div class="ps-bl" style="font-size:9px">${psFmtMon(m)}</div></div>`;
  }).join('');
  const monRows=months.map(m=>{
    const v=monRev[m];const c=monCnt[m];if(!c)return'';
    return`<tr>
      <td style="font-weight:700">${psFmtMon(m)}</td>
      <td>${c}</td>
      <td style="font-weight:900;color:#007aff">RM ${v.toFixed(2)}</td>
      <td style="color:#3b82f6">RM ${monPS5[m].toFixed(2)}</td>
      <td style="color:#10b981">RM ${monPS4[m].toFixed(2)}</td>
    </tr>`;
  }).filter(Boolean).join('');

  function chartWrap(title,barsHtml,legendHtml='',H=100){
    return`<div class="ps-cw">
      <div class="ps-cw-t">${title}</div>
      <div class="ps-bar-area" style="height:${H+30}px;gap:4px;overflow-x:auto;align-items:flex-end">${barsHtml}</div>
      ${legendHtml?`<div class="ps-cl" style="margin-top:10px">${legendHtml}</div>`:''}
    </div>`;
  }

  function legend(color,label){return`<div class="ps-cli"><div class="ps-cld" style="background:${color}"></div>${label}</div>`;}

  document.getElementById('ps-vAnal').innerHTML=`
    <div class="ps-card">
      <div class="ps-ch" style="padding-bottom:12px">
        <div class="ps-ct">📋 Analisis</div>
      </div>

      <!-- ===== DAILY ===== -->
      <div style="padding:0 22px">
        <div class="ps-anal-section-title" style="margin-bottom:14px">
          📅 Analisis Harian
          <input type="date" class="ps-fb" value="${ps_aDate}" style="font-size:12px;padding:5px 10px" onchange="ps_aDate=this.value;psRAnalFull()">
          <span style="font-size:12px;color:var(--t2);font-weight:600">${psFmtDate(ps_aDate)}</span>
        </div>

        <!-- Summary strip -->
        <div class="ps-sum-row" style="margin-bottom:18px">
          <div class="ps-smc"><div class="ps-smc-v" style="color:#007aff">${dayFil.length}</div><div class="ps-smc-l">Booking</div></div>
          <div class="ps-smc"><div class="ps-smc-v" style="color:#10b981">RM ${dayTot.toFixed(2)}</div><div class="ps-smc-l">Hasil</div></div>
          <div class="ps-smc"><div class="ps-smc-v" style="color:#3b82f6">RM ${ps5r.toFixed(2)}</div><div class="ps-smc-l">PS5</div></div>
          <div class="ps-smc"><div class="ps-smc-v" style="color:#10b981">RM ${ps4r.toFixed(2)}</div><div class="ps-smc-l">PS4</div></div>
          <div class="ps-smc"><div class="ps-smc-v" style="color:#ff6b35">RM ${erR.toFixed(2)}</div><div class="ps-smc-l">eRacing</div></div>
        </div>

        ${chartWrap('📊 Hasil per Station (RM)',stBars,
          legend('#3b82f6','PS5')+legend('#10b981','PS4')+legend('#ff6b35','eRacing'),100)}

        ${chartWrap('⏰ Slot Masa (RM)',slotBars,
          legend('#f59e0b','Pagi (9–11am)')+legend('#10b981','Petang (12–4pm)')+legend('#8b5cf6','Malam (5–9pm)'),100)}

        ${chartWrap('👥 1P vs 2P (RM)',pvBars,
          legend('#3b82f6','1 Player')+legend('#ef4444','2 Player'),100)}

        ${chartWrap('💳 Kaedah Bayaran (RM)',payBars,
          legend('#10b981','Cash')+legend('#8b5cf6','QR')+legend('#06b6d4','FPX'),100)}

        ${chartWrap('🎮 PS5 vs PS4 (RM)',psBars,
          legend('#3b82f6','PS5')+legend('#10b981','PS4')+legend('#ff6b35','eRacing'),100)}

        <div class="ps-cw">
          <div class="ps-cw-t">🕐 Hasil Mengikut Jam</div>
          <div class="ps-bar-area" style="height:${H2+30}px;gap:2px;overflow-x:auto;align-items:flex-end">${hrBars}</div>
          <div class="ps-cl" style="margin-top:10px">
            ${legend('#f59e0b','Pagi (10–11am)')}
            ${legend('#10b981','Petang (12–4pm)')}
            ${legend('#8b5cf6','Malam (5–8pm)')}
          </div>
        </div>
      </div>

      <div class="ps-anal-sep"></div>

      <!-- ===== MONTHLY ===== -->
      <div style="padding:0 22px 22px">
        <div class="ps-anal-section-title" style="margin-bottom:14px">
          📆 Analisis Bulanan / Tahunan
          <input type="month" class="ps-fb" value="${ps_aMonth}" style="font-size:12px;padding:5px 10px" onchange="ps_aMonth=this.value;psRAnalFull()">
          <span style="font-size:12px;color:var(--t2);font-weight:600">12 bulan terakhir</span>
        </div>

        ${chartWrap('📊 Hasil Bulanan (RM) — 12 Bulan',monBars,
          legend('#2563eb','3 Bulan Terkini')+legend('#93c5fd','Bulan Sebelumnya'),HM)}

        <div class="ps-cw">
          <div class="ps-cw-t">📋 Jadual Bulanan</div>
          <div class="ps-tw">
            <table class="ps-mon-table">
              <thead><tr><th>BULAN</th><th>BOOKING</th><th>HASIL</th><th>PS5</th><th>PS4</th></tr></thead>
              <tbody>${monRows||`<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--t3)">Tiada data</td></tr>`}</tbody>
            </table>
          </div>
        </div>
      </div>
    </div>`;
}

const PS_TABS_ALL=[{k:'panel',l:'📺 Panel'},{k:'booking',l:'➕ Booking'},{k:'senarai',l:'📋 Senarai'},{k:'analisis',l:'📈 Analisis'},{k:'price',l:'💲 Harga'}];
function getPsTabs(){const isAdmin=currentUser?.role==='Admin';return PS_TABS_ALL.filter(t=>t.k!=='price'||isAdmin);}
const PS_TABS=PS_TABS_ALL;
const PS_VIDS={panel:'ps-vPanel',booking:'ps-vBook',senarai:'ps-vList',analisis:'ps-vAnal',price:'ps-vPrice'};
function psRNav(){document.getElementById('ps-hnav').innerHTML=getPsTabs().map(t=>`<button class="ps-ht${ps_av===t.k?' on':''}" onclick="psSv('${t.k}')">${t.l}</button>`).join('');}
function psSv(v){
  // Guard: staff cannot access price tab
  if(v==='price'&&currentUser?.role!=='Admin'){v='panel';}
  ps_av=v;psRNav();
  PS_TABS_ALL.forEach(t=>{const el=document.getElementById(PS_VIDS[t.k]);if(el)el.style.display=t.k===v?'block':'none';});
  if(v==='panel')psRPanel();
  if(v==='booking'){ps_bF=psNb();psRBook();}
  if(v==='senarai')psRList();
  if(v==='analisis')psRAnalFull();
  if(v==='price')psRPrice();
  psUpdStats();
  // Sync mobile bottom nav — hide Harga for staff
  const isAdmin=currentUser?.role==='Admin';
  document.querySelectorAll('.ps-mnt[data-psv]').forEach(b=>{
    b.classList.toggle('on',b.dataset.psv===v);
    if(b.dataset.psv==='price')b.style.display=isAdmin?'':'none';
  });
}
function psUpdStats(){
  const now=Date.now();
  const actBks=ps_bks.filter(b=>b.status==='a'&&new Date(b.et)>now);
  const act=actBks.length;
  const ps5Act=actBks.filter(b=>PS_STATIONS.find(s=>s.id===b.sid)?.type==='PS5').length;
  const ps4Act=actBks.filter(b=>PS_STATIONS.find(s=>s.id===b.sid)?.type==='PS4').length;
  const erAct=actBks.filter(b=>PS_STATIONS.find(s=>s.id===b.sid)?.type==='eRacing').length;
  const tot=ps_bks.filter(b=>b.date===psMyToday()&&b.status!=='x').reduce((s,b)=>s+b.amt,0);
  const hA=document.getElementById('ps-hAct');const hT=document.getElementById('ps-hTot');const hC=document.getElementById('ps-hClk');
  const hP5=document.getElementById('ps-hPS5');const hP4=document.getElementById('ps-hPS4');const hER=document.getElementById('ps-hER');
  if(hA)hA.textContent=act;if(hT)hT.textContent=tot.toFixed(2);
  if(hP5)hP5.textContent=ps5Act;if(hP4)hP4.textContent=ps4Act;if(hER)hER.textContent=erAct;
  const d=psMyNow();if(hC)hC.textContent=`${psMy2(d.getHours())}:${psMy2(d.getMinutes())}:${psMy2(d.getSeconds())}`;
}

// PS Booking Timer
function psStartTimer(){
  if(ps_tmRef)clearInterval(ps_tmRef);
  ps_tmRef=setInterval(()=>{
    let chg=false;
    ps_bks.forEach(b=>{
      if(b.status!=='a')return;const rem=psGetRemMs(b);const st=PS_STATIONS.find(s=>s.id===b.sid);
      if(rem<=0){b.status='s';chg=true;if(!ps_aledIds.has(b.id)){ps_aledIds.add(b.id);psSpeak(`STATION ${st?.id} TELAH TAMAT`);psBeep(4);psToast(`⏰ ${st?.name} TELAH TAMAT! RM ${b.amt.toFixed(2)} - sila proses.`,'r');}}
      else if(rem<=300000&&!ps_aled5.has(b.id)){ps_aled5.add(b.id);psSpeak(`STATION ${st?.id} MASA BERBAKI 5 MINIT`);psToast(`⚠️ ${st?.name} — BERBAKI ${Math.ceil(rem/60000)} MINIT!`,'a');}
    });
    if(chg){psSave();}
    psUpdStats();
    if(ps_av==='panel'&&ps_pDate===psMyToday()){
      PS_STATIONS.forEach(s=>{
        const b=psGetAB(s.id,ps_pDate);const te=document.getElementById(`ps-tm-${s.id}`);
        if(!te||!b||b.status!=='a')return;const rem=psGetRemMs(b);if(isNaN(rem))return;
        te.textContent=psFmtCd(rem);te.className='ps-stm '+(rem<=0?'ps-tr':rem<300000?'ps-tr':'ps-tg');
        const card=document.getElementById(`ps-sc-${s.id}`);if(card&&rem>0)card.className='ps-sc aktif';
      });
    }
  },1000);
}

function psRenderOverlay(){
  const el=document.getElementById('ps-ovl-content');if(!el)return;
  const now=Date.now();
  let freeC=0,usedC=0;
  const stationBoxes=PS_STATIONS.map(s=>{
    const b=ps_bks.find(bk=>bk.sid===s.id&&bk.status==='a'&&new Date(bk.st)<=now&&new Date(bk.et)>now);
    const rem=b?psGetRemMs(b):0;const isFree=!b||rem<=0;
    if(isFree)freeC++;else usedC++;
    const isWarn=b&&rem>0&&rem<300000;
    const cls=isFree?'ps-ovl-free':(isWarn?'ps-ovl-warn':'ps-ovl-used');
    let timerHtml=isFree?`<div class="ps-ovl-stimer ready">READY</div>`:`<div class="ps-ovl-stimer">${psFmtCd(rem)}</div>`;
    return`<div class="${cls} ps-ovl-sbox"><div class="ps-ovl-slbl">St ${s.id}</div><div class="ps-ovl-stype">${s.type}</div>${timerHtml}</div>`;
  }).join('');
  const tickerItems=['MAIDA ESPORTS','🎮 SELAMAT DATANG KE MAIDA ESPORTS','📺 PAPARAN STESEN LANGSUNG',`✅ ${freeC} STESEN TERSEDIA`,'🕹️ BOOK SEKARANG DI KAUNTER','🏆 MAIDA LEGACY · LA0083119-X','📍 FINANCIAL PARK LABUAN'];
  const tickerHtml=tickerItems.map(t=>`<span class="ps-ovl-ticker-txt">${t}</span><span class="ps-ovl-ticker-sep">✦</span>`).join('');
  el.innerHTML=`
    <div class="ps-ovl-station-bar">${stationBoxes}</div>
    <div class="ps-ovl-ticker"><div class="ps-ovl-ticker-track">${tickerHtml+tickerHtml}</div></div>
  `;
  const fEl=document.getElementById('ps-ovl-free-count');const uEl=document.getElementById('ps-ovl-used-count');
  if(fEl)fEl.textContent=freeC;if(uEl)uEl.textContent=usedC;
}

function psOpenActSheet(bkId){
  const b=ps_bks.find(b=>b.id===bkId);if(!b)return;
  const st=PS_STATIONS.find(s=>s.id===b.sid);
  const isAktif=b.status==='a';const isBatal=b.status==='x';
  const isAdmin=currentUser?.role==='Admin';

// ── Switch Station (PS4 → PS5 only) ────────────────────────────
let _swBkId=null, _swTargetSid=null;

function psOpenSwitchSheet(bkId){
  var b=ps_bks.find(function(x){return x.id===bkId;});
  if(!b)return;
  var st=PS_STATIONS.find(function(s){return s.id===b.sid;});
  if(!st||st.type!=='PS4'){psToast('Hanya PS4 boleh naik taraf ke PS5','r');return;}
  _swBkId=bkId; _swTargetSid=null;

  var ps4p=PS_RATES.PS4?.[b.players]?.[b.dur]||0;
  var ps5p=PS_RATES.PS5?.[b.players]?.[b.dur]||0;
  var diff=ps5p-ps4p;
  var joy=(b.xDS5||0)*8+(b.xDS4||0)*5;

  // Header
  document.getElementById('psSwitchTitle').textContent='Tukar: '+st.name+' → PS5';
  document.getElementById('psSwitchSub').textContent='Masa & joystik dikekalkan';

  // Price info
  document.getElementById('psSwitchInfo').innerHTML=
    '<div class="ps-sw-row"><span class="ps-sw-lbl">'+st.name+' (PS4 · '+b.dur+'j · '+b.players+'P)</span><span class="ps-sw-val">RM '+ps4p.toFixed(2)+'</span></div>'+
    '<div class="ps-sw-row"><span class="ps-sw-lbl">Harga PS5 ('+b.dur+'j · '+b.players+'P)</span><span class="ps-sw-val">RM '+ps5p.toFixed(2)+'</span></div>'+
    '<div class="ps-sw-row" style="border-top:1px dashed #bfdbfe;margin-top:8px;padding-top:8px">'+
      '<span class="ps-sw-lbl">Tambahan bayar</span><span class="ps-sw-diff">+ RM '+diff.toFixed(2)+'</span>'+
    '</div>'+
    (joy>0?'<div class="ps-sw-row" style="font-size:11px;color:#6b7280"><span>Joystik (dikekalkan)</span><span>RM '+joy.toFixed(2)+'</span></div>':'')+
    '<div class="ps-sw-row" style="border-top:1px solid #bfdbfe;margin-top:6px;padding-top:6px;font-size:13px">'+
      '<span class="ps-sw-lbl" style="font-weight:700">Jumlah baru</span>'+
      '<span class="ps-sw-val" style="color:#007aff;font-size:15px">RM '+(ps5p+joy).toFixed(2)+'</span>'+
    '</div>';

  // Available PS5 stations
  var avail=PS_STATIONS.filter(function(s){
    return s.type==='PS5' && !psIsBusy(s.id);
  });
  var grid=document.getElementById('psSwitchGrid');
  var confirm=document.getElementById('psSwitchConfirm');
  if(!avail.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:24px;color:#9ca3af;font-size:13px;font-weight:600">😔 Tiada station PS5 yang kosong</div>';
    confirm.style.display='none';
  }else{
    grid.innerHTML=avail.map(function(s){
      return '<button class="ps-sw-st" id="pssw-'+s.id+'" onclick="psSelectSwSt('+s.id+')">'+
        '<div class="st-type">PS5</div><div class="st-num">St '+s.id+'</div>'+
      '</button>';
    }).join('');
  }
  document.getElementById('psSwitchConfirm').style.display='none';
  document.getElementById('psSwitchSheet').classList.add('show');
}

function psSelectSwSt(sid){
  _swTargetSid=sid;
  document.querySelectorAll('.ps-sw-st').forEach(function(btn){
    var sel=btn.id==='pssw-'+sid;
    btn.classList.toggle('sel',sel);
    btn.querySelector('.st-num').style.color=sel?'rgba(255,255,255,.75)':'#6b7280';
  });
  var tSt=PS_STATIONS.find(function(s){return s.id===sid;});
  var cn=document.getElementById('psSwitchConfirm');
  cn.textContent='✅ Sahkan Tukar ke '+tSt.name+' (PS5)';
  cn.style.display='block';
  cn.onclick=psConfirmSwitch;
}

function psConfirmSwitch(){
  if(!_swBkId||!_swTargetSid)return;
  var b=ps_bks.find(function(x){return x.id===_swBkId;});
  if(!b){psCloseSwitchSheet();return;}
  // Double-check target still free
  if(psIsBusy(_swTargetSid)){
    psToast('Station PS5 sudah ada booking aktif','r');
    psCloseSwitchSheet();
    return;
  }
  var ps5p=PS_RATES.PS5?.[b.players]?.[b.dur]||0;
  var joy=(b.xDS5||0)*8+(b.xDS4||0)*5;
  var oldSt=PS_STATIONS.find(function(s){return s.id===b.sid;});
  b.sid=_swTargetSid;
  b.amt=ps5p+joy;
  psSave();
  psCloseSwitchSheet();
  psCloseActSheet();
  psRPanel();
  psToast('✅ Bertukar ke St '+_swTargetSid+' (PS5) · RM '+b.amt.toFixed(2),'g');
}

function psCloseSwitchSheet(){
  var el=document.getElementById('psSwitchSheet');
  if(el)el.classList.remove('show');
  _swBkId=null; _swTargetSid=null;
}

const SK_USERS = 'mde_users_v1';
let appUsers = [];
let currentUser = null;
let lockTimer = null;
let lockSelectedUser = null;
const LOCK_TIMEOUT = 5 * 60 * 1000; // 5 minit

// Simple encode (not cryptographic — local app only)
function encPwd(p) { return btoa(unescape(encodeURIComponent(p + '_mde_salt'))); }

function loadUsers() {
  try { const u=localStorage.getItem(SK_USERS); if(u) appUsers=JSON.parse(u); } catch(e){}
  // Force reset if old credentials detected (migration)
  if(appUsers.find(u=>u.username==='ak'||u.username==='squall')) { appUsers=[]; localStorage.removeItem(SK_USERS); }
  if(!appUsers.length) seedUsers();
}
function saveUsers() { localStorage.setItem(SK_USERS, JSON.stringify(appUsers)); }

function seedUsers() {
  appUsers = [
    { id:'u1', username:'admin',  password:encPwd('777'),  role:'Admin', color:'#d4006b' },
    { id:'u2', username:'staf',   password:encPwd('0001'), role:'Staff', color:'#5b5bd6', permissions:DEFAULT_STAFF_PERMS },
  ];
  saveUsers();
}

// ---- Lock / Unlock ----
function showLock(timeout=false) {
  const ls = document.getElementById('lockScreen');
  if(!ls) return;
  ls.style.display='flex';
  clearInterval(lockTimer);
  if(timeout) { const tm=document.getElementById('lockTimeoutMsg'); if(tm) tm.style.display='block'; }
  updateLockTime();
  setInterval(updateLockTime,60000);
  setTimeout(()=>{document.getElementById('lockUser')?.focus();},150);
}

function renderUserTabs() {
  const wrap=document.getElementById('userTabsLock'); if(!wrap) return;
  if(!lockSelectedUser && appUsers.length) lockSelectedUser=appUsers[0].username;
  wrap.innerHTML=appUsers.map(u=>`<button class="user-tab${lockSelectedUser===u.username?' active':''}" onclick="selectLockUser('${u.username}')">${u.username}</button>`).join('');
}

window.selectLockUser = u => { lockSelectedUser=u; renderUserTabs(); document.getElementById('lockError').classList.remove('show'); document.getElementById('lockPass').value=''; document.getElementById('lockPass').focus(); };

window.toggleLockEye = () => {
  const inp=document.getElementById('lockPass'), btn=document.getElementById('eyeBtn');
  if(inp.type==='password'){inp.type='text';btn.textContent='🙈';}
  else{inp.type='password';btn.textContent='👁️';}
};

window.tryLogin = () => {
  const uname=(document.getElementById('lockUser')?.value||'').trim().toLowerCase();
  const pass=document.getElementById('lockPass')?.value||'';
  if(!uname){showError('Please enter your username');return;}
  if(!pass){showError('Please enter your password');return;}
  const user=appUsers.find(u=>u.username.toLowerCase()===uname);
  if(!user){showError('Incorrect username or password');return;}
  if(encPwd(pass)===user.password){
    currentUser=user;
    const ls=document.getElementById('lockScreen'); if(ls) ls.style.display='none';
    const tm=document.getElementById('lockTimeoutMsg'); if(tm) tm.style.display='none';
    document.getElementById('lockError').classList.remove('show');
    resetLockTimer();
    applyTabVisibility();
    // Sync PS timers to Service Worker for background notifications
    setTimeout(() => { pwaSyncActiveBookings(); }, 1500);
    // Buka Transaksi bulan semasa
    activeTab='calendar';
    const now=new Date();
    curY=now.getFullYear();
    curM=now.getMonth(); // 0-indexed
    render();
    // Highlight tab aktif
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab==='calendar'));
  } else {
    showError('Kata laluan salah. Cuba lagi.');
    const inp=document.getElementById('lockPass'); if(inp){inp.value='';inp.focus();}
    const ls=document.getElementById('lockScreen'); if(ls) ls.style.animation='shake .3s';
  }
};

function showError(msg){
  const el=document.getElementById('lockError'); if(!el) return;
  el.textContent='❌ '+msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}

function updateLockTime(){
  const el=document.getElementById('lockTime'); if(!el) return;
  const now=new Date();
  el.textContent=now.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'})+'  ·  '+now.toLocaleDateString('ms-MY',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}

// Auto-lock timer
function resetLockTimer(){
  clearTimeout(lockTimer);
  lockTimer=setTimeout(()=>{ currentUser=null; showLock(true); }, LOCK_TIMEOUT);
}

// Listen for any activity to reset timer
['click','keydown','scroll','touchstart'].forEach(ev=>{
  document.addEventListener(ev, ()=>{ if(currentUser) resetLockTimer(); }, {passive:true});
});

// Enter key in password field
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('lockPass')?.addEventListener('keypress', e=>{ if(e.key==='Enter') tryLogin(); });
});

window.saveUserModal = (editId) => {

  const adminBtn = document.getElementById('roleAdminBtn');

  // Collect permissions
  const perms = [];
  document.querySelectorAll('[data-key]').forEach(el => {
    if (el.dataset.on === '1') perms.push(el.dataset.key);
  });

  if (editId) {
    // Edit existing
    const user = appUsers.find(u => u.id === editId);
    if (!user) return;
    // Check username conflict
    if (un !== user.username && appUsers.find(u => u.username.toLowerCase() === un.toLowerCase())) { alert('Username sudah wujud!'); return; }
    user.username = un;
    user.color = color;
    user.role = role;
    user.permissions = role === 'Admin' ? ALL_MODULES.map(m=>m.key) : perms;
    if (pw && pw.length >= 3) user.password = encPwd(pw);
    // Update currentUser if editing self
    if (user.id === currentUser?.id) currentUser = { ...currentUser, ...user };
  } else {
    // Add new
    if (!pw || pw.length < 3) { alert('Kata laluan minimum 3 aksara'); return; }
    if (appUsers.find(u => u.username.toLowerCase() === un.toLowerCase())) { alert('Username sudah wujud!'); return; }

      id: 'u' + Date.now(),
      username: un,
      password: encPwd(pw),
      role,
      color,
      permissions: role === 'Admin' ? ALL_MODULES.map(m=>m.key) : perms

  saveUsers();
  closeUserModal();

// Apply tab visibility based on permissions
function applyTabVisibility() {
  if (!currentUser) return;
  const perms = getUserPerms(currentUser);
  const isMobile = window.innerWidth < 1024;

  document.querySelectorAll('.tab[data-tab]').forEach(t => {
    const tab = t.dataset.tab;
    if (!tab || tab === '_more') return;

    const isDesktopOnly = t.classList.contains('desk-only');
    const isMobOnly     = t.classList.contains('mob-only');
    const isCoreTab     = tab === 'home' || tab === 'calendar';
    const hasPermission = isCoreTab || perms.includes(tab);

    // First: hide if no permission
    if (!hasPermission) {
      t.style.cssText += ';display:none!important';
      return;
    }

    // Then: apply responsive visibility
    t.style.removeProperty('display');
    if (isMobile && isDesktopOnly) {
      t.style.cssText += ';display:none!important';
    } else if (!isMobile && isMobOnly) {
      t.style.cssText += ';display:none!important';
    }
  });
}

function achGetDailyTotal(dateStr){
  return tx.filter(t=>t.type==='income'&&t.date===dateStr).reduce((s,t)=>s+(t.amount||0),0);
}
function achGetWeekTotal(weekStr){ // weekStr = YYYY-WW
  return tx.filter(t=>t.type==='income'&&t.date&&achGetWeekKey(t.date)===weekStr).reduce((s,t)=>s+(t.amount||0),0);
}
function achGetWeekKey(dateStr){
  const d=new Date(dateStr+' 12:00');
  const jan1=new Date(d.getFullYear(),0,1);
  const week=Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
  return `${d.getFullYear()}-W${String(week).padStart(2,'0')}`;
}
function achGetMonthTotal(monthStr){ // YYYY-MM
  return tx.filter(t=>t.type==='income'&&t.date&&t.date.startsWith(monthStr)).reduce((s,t)=>s+(t.amount||0),0);
}

function achCheckAll(){
  achLoad();
  const now=new Date();
  const todStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const weekStr=achGetWeekKey(todStr);
  const monStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  const todayInc=achGetDailyTotal(todStr);
  const weekInc=achGetWeekTotal(weekStr);
  const monInc=achGetMonthTotal(monStr);

  const allWeeks={}, allMonths={};
  tx.filter(t=>t.type==='income'&&t.date).forEach(t=>{
    const wk=achGetWeekKey(t.date); allWeeks[wk]=(allWeeks[wk]||0)+(t.amount||0);
    const mn=t.date.slice(0,7); allMonths[mn]=(allMonths[mn]||0)+(t.amount||0);
  });
  const bestWeek=Math.max(0,...Object.values(allWeeks));
  const bestMonth=Math.max(0,...Object.values(allMonths));

  // Streak calculation — consecutive days with income
  let streak=0;
  const d=new Date(now);
  for(let i=0;i<60;i++){
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(achGetDailyTotal(ds)>0) streak++;
    else break;
    d.setDate(d.getDate()-1);
  }

  // Total PS bookings (all time, non-cancelled)
  const totalBk=typeof ps_bks!=='undefined'?ps_bks.filter(b=>b.status!=='x').length:0;
  // PS5 bookings
  const totalPs5Bk=typeof ps_bks!=='undefined'?ps_bks.filter(b=>b.status!=='x'&&PS_STATIONS?.find(s=>s.id===b.sid)?.type==='PS5').length:0;
  // All stations full right now
  const nowMs=Date.now();
  const activeNow=typeof ps_bks!=='undefined'?ps_bks.filter(b=>b.status==='a'&&new Date(b.st)<=nowMs&&new Date(b.et)>nowMs).length:0;

  let newlyUnlocked=[];
  ACH_DEFS.forEach(a=>{
    if(achUnlocked[a.id]) return;
    let achieved=false, val=0;
    if(a.type==='daily')         { achieved=todayInc>=a.target;   val=todayInc; }
    if(a.type==='weekly')        { achieved=weekInc>=a.target;    val=weekInc; }
    if(a.type==='weekly_best')   { achieved=weekInc>0&&weekInc>=bestWeek; val=weekInc; }
    if(a.type==='monthly')       { achieved=monInc>=a.target;     val=monInc; }
    if(a.type==='monthly_best')  { achieved=monInc>0&&monInc>=bestMonth; val=monInc; }
    if(a.type==='streak')        { achieved=streak>=a.target;     val=streak; }
    if(a.type==='total_booking') { achieved=totalBk>=a.target;    val=totalBk; }
    if(a.type==='ps5_booking')   { achieved=totalPs5Bk>=a.target; val=totalPs5Bk; }
    if(a.type==='all_stations')  { achieved=activeNow>=10;        val=activeNow; }
    if(achieved){
      achUnlocked[a.id]={ unlockedAt:new Date().toISOString(), value:val };
      newlyUnlocked.push(a);
    }
  });
  if(newlyUnlocked.length) achSave();
  return newlyUnlocked;
}

function achTriggerFirework(){
  const canvas=document.getElementById('fw-canvas');
  if(!canvas) return;
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  canvas.style.display='block';
  const ctx=canvas.getContext('2d');
  const particles=[];
  const colors=['#fbbf24','#f59e0b','#ef4444','#8b5cf6','#3b82f6','#10b981','#ec4899','#ffffff'];

  for(let b=0;b<8;b++){
    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height*0.6;
    for(let i=0;i<60;i++){
      const angle=Math.random()*Math.PI*2;
      const speed=2+Math.random()*6;
      particles.push({ x,y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-3, alpha:1, color:colors[Math.floor(Math.random()*colors.length)], size:2+Math.random()*3, gravity:.12 });
    }
  }

  let frame=0;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.gravity; p.alpha-=.012; p.vx*=.99;
      if(p.alpha<=0) return;
      ctx.globalAlpha=p.alpha;
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
    frame++;
    if(frame<200) requestAnimationFrame(animate);
    else{ canvas.style.display='none'; ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  animate();
}

  for(let i=5;i>=0;i--){

    months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:`${MN[d.getMonth()]} ${d.getFullYear()}`});
  }

  const rows=months.map(m=>{
    const allInc=tx.filter(t=>t.type==='income'&&t.date&&t.date.startsWith(m.key));
    const exp=tx.filter(t=>t.type==='expense'&&t.date&&t.date.startsWith(m.key)).reduce((s,t)=>s+(t.amount||0),0);
    const totInc=allInc.reduce((s,t)=>s+(t.amount||0),0);

    // PS Booking sewaan: from ps_bks directly
    const psBkAmt=ps_bks.filter(b=>b.date&&b.date.startsWith(m.key)&&b.status!=='x').reduce((s,b)=>s+b.amt,0);

    // Also from Transaksi with Sewaan keyword (for older months before PS Booking existed)
    const txSewaan=allInc.filter(t=>{

    }).reduce((s,t)=>s+(t.amount||0),0);

    // Use whichever is higher (avoid double-counting if same data)
    const psTotal=Math.max(psBkAmt, txSewaan);
    const sstAmt=psTotal*SST_RATE;
    const otherInc=Math.max(0,totInc-psTotal);
    return{...m,inc:totInc,exp,psTotal,psBkAmt,txSewaan,sstAmt,otherInc};
