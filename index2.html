// ================================================================
//  PWA — SERVICE WORKER & PUSH NOTIFICATIONS
// ================================================================
const PWA_KEY = 'mde_pwa_v1';
let _swReg = null;

async function pwaInit() {
  if (!('serviceWorker' in navigator)) {
    console.log('PWA: Service Worker tidak disokong');
    return;
  }
  try {
    _swReg = await navigator.serviceWorker.register('sw.js', { scope: './' });
    console.log('✅ PWA: Service Worker didaftarkan');

    // Listen for messages from SW
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data?.type === 'TIMER_END') {
        const sid = e.data.stationId;
        const st = PS_STATIONS?.find(s => s.id === sid);
        psToast && psToast(`⏰ ${st?.name || 'Station '+sid} TELAH TAMAT!`, 'r');
      }
    });
  } catch(err) {
    console.warn('PWA: SW registration failed:', err);
  }
}

async function pwaRequestNotif() {
  if (!('Notification' in window)) {
    alert('Browser anda tidak menyokong notifikasi push.');
    return false;
  }
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') {
    alert('Notifikasi disekat. Sila benarkan notifikasi dalam tetapan browser.');
    return false;
  }
  const perm = await Notification.requestPermission();
  return perm === 'granted';
}

function pwaScheduleTimer(bkId, stationId, stationName, endIso, amtRm) {
  if (!_swReg) return;
  const msLeft = new Date(endIso).getTime() - Date.now();
  if (msLeft <= 0) return;

  // Schedule via SW
  _swReg.active?.postMessage({
    type: 'SCHEDULE_TIMER',
    bkId, stationId, stationName,
    endTime: new Date(endIso).getTime(),
    amtRm
  });

  // Also schedule 5-min warning
  const warn5 = msLeft - 300000;
  if (warn5 > 0) {
    _swReg.active?.postMessage({
      type: 'SCHEDULE_WARNING',
      bkId, stationId, stationName,
      fireAt: Date.now() + warn5,
      amtRm
    });
  }
}

function pwaCancelTimer(bkId) {
  _swReg?.active?.postMessage({ type: 'CANCEL_TIMER', bkId });
}

// Send all active bookings to SW on load/focus
function pwaSyncActiveBookings() {
  if (!_swReg?.active) return;
  const active = ps_bks.filter(b => b.status === 'a' && new Date(b.et) > new Date());
  active.forEach(b => {
    const st = PS_STATIONS?.find(s => s.id === b.sid);
    pwaScheduleTimer(b.id, b.sid, st?.name || 'Station '+b.sid, b.et, b.amt);
  });
}

// Show PWA install prompt
let _pwaInstallEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _pwaInstallEvt = e;
  // Show install banner after 3 seconds
  setTimeout(() => showPwaInstallBanner(), 3000);
});

function showPwaInstallBanner() {
  if (!_pwaInstallEvt) return;
  if (localStorage.getItem('mde_pwa_dismissed')) return;
  let banner = document.getElementById('pwa-install-banner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'pwa-install-banner';
    banner.style.cssText = 'position:fixed;bottom:80px;left:12px;right:12px;z-index:9997;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 8px 32px rgba(0,0,0,.3);display:flex;align-items:center;gap:14px;animation:slideUp .3s ease;border:1px solid rgba(255,255,255,.1)';
    banner.innerHTML = `
      <div style="font-size:32px">📱</div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:800;margin-bottom:3px">Pasang MDE Finance</div>
        <div style="font-size:11px;color:rgba(255,255,255,.6)">Install app untuk notifikasi timer PS walaupun browser tutup</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button onclick="pwaInstall()" style="padding:8px 16px;border:none;border-radius:10px;background:#d4006b;color:#fff;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap">Pasang</button>
        <button onclick="pwaDismissBanner()" style="padding:5px 10px;border:none;border-radius:8px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);font-size:11px;cursor:pointer;font-family:inherit">Nanti</button>
      </div>`;
    document.body.appendChild(banner);
  }
}

window.pwaInstall = async () => {
  if (!_pwaInstallEvt) return;
  _pwaInstallEvt.prompt();
  const { outcome } = await _pwaInstallEvt.userChoice;
  if (outcome === 'accepted') {
    document.getElementById('pwa-install-banner')?.remove();
    psToast && psToast('✅ MDE Finance berjaya dipasang!', 'g');
  }
  _pwaInstallEvt = null;
};

window.pwaDismissBanner = () => {
  document.getElementById('pwa-install-banner')?.remove();
  localStorage.setItem('mde_pwa_dismissed', '1');
};

// ================================================================
//  INIT — Load all data then show app
// ================================================================
(async function init() {
  loadUsers();
  // Load all modules in parallel
  await Promise.all([
    loadData(),
    loadModules(),
    loadDocs(),
    loadGaji(),
    loadStaff(),
  ]);
  generateDummyData();
  seedClients();
  seedStock();
  seedReminders();
  // Show lock screen on startup
  showLock(false);
  autoBackupCheck();
  pwaInit(); // Register Service Worker
  // render() will be called after login
  showSyncStatus('ok');
  if(typeof initAutoBackup==='function')initAutoBackup();
})();
